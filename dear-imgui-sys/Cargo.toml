[package]
name = "dear-imgui-sys"
version.workspace = true
edition.workspace = true
description = "Low-level FFI bindings to Dear ImGui v1.92.9b (docking branch) via cimgui (C API)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imgui-sys"
categories.workspace = true
keywords.workspace = true
build = "build.rs"
links = "dear-imgui"

# Exclude unnecessary files to reduce package size
exclude = [
    # Exclude heavy upstream folders from cimgui/imgui submodule
    "third-party/cimgui/imgui/.github/**",
    "third-party/cimgui/imgui/docs/**",
    "third-party/cimgui/imgui/examples/**",
    "third-party/cimgui/imgui/misc/cpp/**",
    "third-party/cimgui/imgui/misc/debuggers/**",
    "third-party/cimgui/imgui/misc/fonts/**",
    "third-party/cimgui/imgui/misc/single_file/**",
    # cimgui helper/test/generator content not needed for building
    "third-party/cimgui/.github/**",
    "third-party/cimgui/backend_test/**",
    "third-party/cimgui/generator/**",
    "third-party/cimgui/test/**",
]

[package.metadata.dear-imgui-sources]
cimgui-revision = "125f397e0982fe9466eb0a162de547be5efec849"
imgui-revision = "b48d1afbe8ee8b238e2961dc363a949dd7304e23"

# docs.rs configuration for offline builds
[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
mint.workspace = true
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
glam = { workspace = true, optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
cc.workspace = true
build-support = { workspace = true, features = ["binding-spec"] }

[[bin]]
name = "package"
path = "bin/package/main.rs"
required-features = ["package-bin"]

[features]
default = []
bindgen = ["dep:bindgen"]
# Enable Dear ImGui test engine hooks (requires linking dear-imgui-test-engine-sys).
# Test engine hooks alter the native core artifact and therefore require a source build.
test-engine = ["build-from-source"]
# Internal CI-only C++/Rust aggregate layout probe. This source-only feature is
# intentionally not needed by normal or prebuilt consumers.
abi-probe = ["build-from-source"]
# Enable freetype font rasterizer
freetype = ["pkg-config", "vcpkg"]
pkg-config = ["build-support/pkg-config"]
vcpkg = ["build-support/vcpkg"]
# Enable for WASM targets
wasm = []
# Enable the native patched Dear ImGui artifact used by blueprint-style stack layouts.
stack-layout = []
package-bin = ["dep:flate2", "dep:tar"]
prebuilt = ["build-support/download"]
build-from-source = []
glam = ["dep:glam"]
backend-shim-android = []
backend-shim-dx11 = []
backend-shim-dx12 = []
backend-shim-metal = []
backend-shim-opengl3 = []
backend-shim-osx = []
backend-shim-win32 = []

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSDate", "NSRunLoop", "NSObjCRuntime", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLRenderPass"] }

[[example]]
name = "dx12_headless"
required-features = ["backend-shim-dx12"]

[[example]]
name = "win32_dx11"
required-features = ["backend-shim-win32", "backend-shim-dx11"]

[[example]]
name = "win32_opengl3"
required-features = ["backend-shim-win32", "backend-shim-opengl3"]

[[example]]
name = "cocoa_metal"
required-features = ["backend-shim-osx", "backend-shim-metal"]
