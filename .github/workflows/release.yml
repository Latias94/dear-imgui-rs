name: Release
run-name: Release ${{ inputs.tag }} from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the workspace version
        required: true
        type: string

env:
  RELEASE_TAG_INPUT: ${{ inputs.tag }}
  RELEASE_CANDIDATE_SHA: ${{ github.sha }}

concurrency:
  group: dear-imgui-release
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind tag, main, and candidate
        run: >-
          python3 -B tools/ci/run_contract.py release-identity
          --tag "$RELEASE_TAG_INPUT"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --actual-ref "$GITHUB_REF"

      - name: Require successful exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          response = subprocess.run(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  (
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/"
                      f"workflows/ci.yml/runs?branch=main&head_sha="
                      f"{os.environ['RELEASE_CANDIDATE_SHA']}&event=push&per_page=100"
                  ),
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          runs = json.loads(response.stdout)["workflow_runs"]
          if not runs:
              sys.exit("no exact-SHA CI run found")
          latest = max(runs, key=lambda run: (run["created_at"], run["id"]))
          if latest["status"] != "completed" or latest["conclusion"] != "success":
              sys.exit("latest exact-SHA CI run is not successful")

      - name: Validate release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -B tools/ci/run_contract.py release-notes

  prebuilt:
    needs: validate
    uses: ./.github/workflows/prebuilt-binaries.yml
    permissions:
      contents: read
    with:
      candidate_sha: ${{ github.sha }}

  publish-crates:
    name: Publish crates.io release train
    needs: [validate, prebuilt]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true

      - name: Initialize required nested submodules
        run: python3 -B tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Revalidate release identity
        run: >-
          python3 -B tools/ci/run_contract.py release-identity
          --tag "$RELEASE_TAG_INPUT"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --actual-ref "$GITHUB_REF"

      - name: Acquire short-lived crates.io token
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish complete crates.io release train
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: >-
          python3 -B tools/publish.py
          --yes
          --no-verify
          --publish-timeout 300
          --journal "$RUNNER_TEMP/publication-journal.json"

      - name: Retain publication journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-journal-${{ github.sha }}
          path: ${{ runner.temp }}/publication-journal.json
          if-no-files-found: warn
          retention-days: 30

  github-release:
    name: Create GitHub release
    needs: [validate, prebuilt, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Download prebuilt packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: prebuilt-*-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Write package checksums
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "release-assets"
          archives = sorted(root.glob("*.tar.gz"))
          if not archives:
              raise SystemExit("no prebuilt packages were downloaded")
          lines = []
          for path in archives:
              with path.open("rb") as archive:
                  digest = hashlib.file_digest(archive, "sha256").hexdigest()
              lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Revalidate release identity
        run: >-
          python3 -B tools/ci/run_contract.py release-identity
          --tag "$RELEASE_TAG_INPUT"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --actual-ref "$GITHUB_REF"

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -B tools/ci/run_contract.py release-notes --output release-notes.md

      - name: Verify every crate version is published
        run: >-
          python3 -B tools/publish.py
          --verify-published
          --index-timeout 300
          --poll-interval 2

      - name: Reject stale assets on an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          asset_root = Path(os.environ["RUNNER_TEMP"]) / "release-assets"
          expected = {path.name for path in asset_root.iterdir() if path.is_file()}
          if not expected:
              sys.exit("the release asset set is empty")

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = urllib.parse.quote(os.environ["RELEASE_TAG_INPUT"], safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  release = None
              else:
                  raise

          if release is not None:
              existing = {asset["name"] for asset in release["assets"]}
              unexpected = sorted(existing - expected)
              if unexpected:
                  sys.exit(f"existing release contains stale assets: {unexpected}")

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          body_path: release-notes.md
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          make_latest: ${{ contains(inputs.tag, '-') && 'false' || 'true' }}
