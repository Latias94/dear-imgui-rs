name: Native runtime contract

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact release candidate commit
        required: true
        type: string
      contract:
        required: true
        type: string
      gate_attempt:
        required: true
        type: number
    outputs:
      retry_eligible:
        description: Whether one fresh-runner infrastructure retry is allowed
        value: ${{ jobs.runtime.outputs.retry_eligible }}

permissions:
  contents: read

env:
  RUNTIME_CONTRACT: ${{ inputs.contract }}
  RUNTIME_GATE_ATTEMPT: ${{ inputs.gate_attempt }}

jobs:
  runtime:
    name: ${{ inputs.contract }} (attempt ${{ inputs.gate_attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      retry_eligible: ${{ steps.gate.outputs.retry_eligible || steps.preparation.outputs.retry_eligible || (inputs.gate_attempt == 1 && 'true') || 'false' }}
    steps:
      - name: Checkout repository
        id: checkout
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Init core runtime sources
        id: core_sources
        if: steps.checkout.outcome == 'success' && inputs.contract == 'ash-vulkan-validation-smoke'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: python3 tools/ci/update_submodules.py --profile runtime-core

      - name: Init Test Engine runtime sources
        id: test_engine_sources
        if: steps.checkout.outcome == 'success' && inputs.contract != 'ash-vulkan-validation-smoke'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: python3 tools/ci/update_submodules.py --profile runtime-test-engine

      - name: Install Rust toolchain
        id: toolchain
        if: >-
          steps.checkout.outcome == 'success' &&
          ((inputs.contract == 'ash-vulkan-validation-smoke' && steps.core_sources.outcome == 'success') ||
           (inputs.contract != 'ash-vulkan-validation-smoke' && steps.test_engine_sources.outcome == 'success'))
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          key: native-runtime-${{ inputs.contract }}

      - name: Refresh native package metadata
        id: apt_update
        if: steps.toolchain.outcome == 'success'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: sudo apt-get update

      - name: Install common native runtime dependencies
        id: common_deps
        if: steps.apt_update.outcome == 'success'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev xvfb x11-utils openbox

      - name: Install Vulkan runtime dependencies
        id: vulkan_deps
        if: steps.common_deps.outcome == 'success' && inputs.contract != 'sdl3-glow-multi-viewport-smoke'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      - name: Install Vulkan validation dependencies
        id: validation_deps
        if: steps.vulkan_deps.outcome == 'success' && inputs.contract == 'ash-vulkan-validation-smoke'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: sudo apt-get install -y vulkan-validationlayers

      - name: Install OpenGL runtime dependencies
        id: opengl_deps
        if: steps.common_deps.outcome == 'success' && inputs.contract == 'sdl3-glow-multi-viewport-smoke'
        continue-on-error: ${{ inputs.gate_attempt == 1 }}
        run: sudo apt-get install -y mesa-utils libgl1-mesa-dev libgl1-mesa-dri

      - name: Execute native runtime contract
        id: gate
        if: >-
          steps.common_deps.outcome == 'success' &&
          ((inputs.contract == 'sdl3-glow-multi-viewport-smoke' && steps.opengl_deps.outcome == 'success') ||
           (inputs.contract != 'sdl3-glow-multi-viewport-smoke' && steps.vulkan_deps.outcome == 'success')) &&
          (inputs.contract != 'ash-vulkan-validation-smoke' || steps.validation_deps.outcome == 'success')
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
        run: >-
          python3 tools/ci/run_contract.py "$RUNTIME_CONTRACT"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --evidence-dir "target/runtime-evidence/$RUNTIME_CONTRACT"
          --attempt "$RUNTIME_GATE_ATTEMPT"
          --defer-infrastructure-retry

      - name: Classify runtime preparation failure
        id: preparation
        if: always() && steps.gate.outcome == 'skipped' && hashFiles('tools/ci/run_contract.py') != ''
        run: >-
          python3 tools/ci/run_contract.py runtime-preparation-failure
          --gate "$RUNTIME_CONTRACT"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --evidence-dir "target/runtime-evidence/$RUNTIME_CONTRACT"
          --attempt "$RUNTIME_GATE_ATTEMPT"

      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-runtime-${{ inputs.contract }}-${{ inputs.candidate_sha }}-gate-${{ inputs.gate_attempt }}
          path: target/runtime-evidence/${{ inputs.contract }}
          if-no-files-found: warn
          retention-days: 30
