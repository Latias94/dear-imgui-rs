name: Native runtime contract

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact release candidate commit
        required: true
        type: string
      contract:
        required: true
        type: string
      gate_attempt:
        required: true
        type: number
    outputs:
      retry_eligible:
        description: Whether one fresh-runner infrastructure retry is allowed
        value: ${{ jobs.runtime.outputs.retry_eligible }}
      gate_success:
        description: Whether the runtime gate passed
        value: ${{ jobs.runtime.outputs.gate_success }}

permissions:
  contents: read

env:
  RUNTIME_CONTRACT: ${{ inputs.contract }}
  RUNTIME_GATE_ATTEMPT: ${{ inputs.gate_attempt }}

jobs:
  runtime:
    name: ${{ inputs.contract }} (attempt ${{ inputs.gate_attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      retry_eligible: ${{ steps.gate.outputs.retry_eligible || steps.preparation.outputs.retry_eligible || (inputs.gate_attempt == 1 && 'true') || 'false' }}
      gate_success: ${{ steps.gate.outputs.gate_success || steps.preparation.outputs.gate_success || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ inputs.candidate_sha }}

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: "false"
          key: native-runtime-${{ inputs.contract }}

      - name: Refresh native package metadata
        run: sudo apt-get update

      - name: Install native runtime dependencies
        run: sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev xvfb x11-utils openbox mesa-vulkan-drivers vulkan-tools vulkan-validationlayers mesa-utils libgl1-mesa-dev libgl1-mesa-dri

      - name: Execute native runtime contract
        id: gate
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
        run: >-
          python3 tools/ci/run_contract.py "$RUNTIME_CONTRACT"
          --evidence-dir "target/runtime-evidence/$RUNTIME_CONTRACT"
          --attempt "$RUNTIME_GATE_ATTEMPT"
          --defer-infrastructure-retry

      - name: Classify runtime preparation failure
        id: preparation
        if: always() && steps.gate.outcome == 'skipped' && hashFiles('tools/ci/run_contract.py') != ''
        run: >-
          python3 tools/ci/run_contract.py runtime-preparation-failure
          --gate "$RUNTIME_CONTRACT"
          --evidence-dir "target/runtime-evidence/$RUNTIME_CONTRACT"
          --attempt "$RUNTIME_GATE_ATTEMPT"

      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-runtime-${{ inputs.contract }}-${{ inputs.candidate_sha }}-gate-${{ inputs.gate_attempt }}
          path: target/runtime-evidence/${{ inputs.contract }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true
