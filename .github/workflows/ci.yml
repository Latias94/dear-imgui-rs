name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Reduce disk usage in CI (helps avoid "No space left on device" from LLVM/rustc).
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-Cdebuginfo=0"
  # Existing workspace-wide lint debt. Broad Clippy routes deny every warning except this
  # explicit baseline; new release and binding tooling below has no allowances.
  CLIPPY_HISTORICAL_LINTS: >-
    -A dead_code
    -A clippy::assertions_on_constants
    -A clippy::collapsible_if
    -A clippy::collapsible_match
    -A clippy::default_constructed_unit_structs
    -A clippy::derivable_impls
    -A clippy::doc_lazy_continuation
    -A clippy::drop_non_drop
    -A clippy::explicit_auto_deref
    -A clippy::explicit_counter_loop
    -A clippy::field_reassign_with_default
    -A clippy::get_first
    -A clippy::if_same_then_else
    -A clippy::items_after_test_module
    -A clippy::large_enum_variant
    -A clippy::let_and_return
    -A clippy::manual_c_str_literals
    -A clippy::manual_div_ceil
    -A clippy::manual_is_multiple_of
    -A clippy::manual_unwrap_or
    -A clippy::manual_unwrap_or_default
    -A clippy::missing_const_for_thread_local
    -A clippy::missing_safety_doc
    -A clippy::module_inception
    -A clippy::needless_borrow
    -A clippy::needless_lifetimes
    -A clippy::needless_option_as_deref
    -A clippy::needless_range_loop
    -A clippy::new_ret_no_self
    -A clippy::new_without_default
    -A clippy::nonminimal_bool
    -A clippy::obfuscated_if_else
    -A clippy::question_mark
    -A clippy::redundant_closure
    -A clippy::result_large_err
    -A clippy::should_implement_trait
    -A clippy::single_match
    -A clippy::too_many_arguments
    -A clippy::type_complexity
    -A clippy::unnecessary_cast
    -A clippy::unnecessary_lazy_evaluations
    -A clippy::useless_conversion
    -A clippy::vec_box
    -A clippy::wrong_self_convention

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - name: Refresh Linux package metadata
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get install -y
          build-essential pkg-config
          libfreetype6-dev
          libasound2-dev
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev libgl1-mesa-dev cmake

      - name: Refresh Homebrew metadata
        if: runner.os == 'macOS'
        run: brew update

      - name: Install macOS deps
        if: runner.os == 'macOS'
        # CMake is needed by various -sys crates; SDL3 is provided by the system.
        run: brew install cmake freetype pkg-config sdl3

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: choco install -y cmake

      - name: Build workspace (native)
        run: cargo build --workspace --exclude dear-imgui-examples --exclude dear-imgui-web-demo --exclude xtask
        env:
          # Force building from source in CI for stability
          IMGUI_SYS_FORCE_BUILD: "1"
          IMPLOT_SYS_FORCE_BUILD: "1"
          IMNODES_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"
          IMGUIZMO_SYS_FORCE_BUILD: "1"

      - name: Test cross-platform release tooling
        run: cargo nextest run -p xtask

      - name: Check FreeType feature through native package metadata
        if: runner.os != 'Windows'
        run: cargo check -p dear-imgui-sys --no-default-features --features freetype
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Run dear-imgui-rs multi-viewport acceptance tests
        run: cargo nextest run -p dear-imgui-rs --features multi-viewport

      - name: Run canonical custom renderer example
        if: runner.os == 'Linux'
        run: cargo run -p dear-imgui-rs --example custom_renderer_headless

      - name: Compare public C++ aggregate layouts on non-Windows ABI
        if: runner.os != 'Windows'
        run: >-
          cargo nextest run -j 1 -p dear-imgui-rs
          --features multi-viewport,abi-probe
          cpp_public_aggregate_layout_probe_matches_rust
          public_aggregate_layout_probe_rejects_an_abi_mismatch
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Run Glow renderer acceptance tests
        run: cargo nextest run -p dear-imgui-glow --features multi-viewport

      - name: Run reflection acceptance tests
        run: cargo nextest run -p dear-imgui-reflect --features glam,mint

      - name: Run ImPlot3D acceptance tests
        run: cargo nextest run -p dear-implot3d

      - name: Run file browser acceptance tests
        run: cargo nextest run -p dear-file-browser

      - name: Run dear-app lifecycle acceptance tests
        run: cargo nextest run -p dear-app

      - name: Run winit backend multi-viewport tests
        run: cargo nextest run -p dear-imgui-winit --lib --features "multi-viewport"

      - name: Build dear-app with all add-ons
        run: cargo build -p dear-app --features "implot imnodes implot3d"

      - name: Build examples (all extensions)
        run: cargo build -p dear-imgui-examples --features "imguizmo imnodes implot reflect implot3d imguizmo-quat"

      - name: Test focused examples
        run: cargo nextest run -p dear-imgui-examples --bin style_and_fonts --bin task_organizer

      - name: Check Winit multi-viewport examples
        run: cargo check -p dear-imgui-examples --features "multi-viewport" --bin multi_viewport_wgpu --bin multi_viewport_ash

      - name: Check Ash dynamic-rendering multi-viewport smoke harness
        run: cargo check -p dear-imgui-examples --features "ash-winit-multi-viewport,ash-dynamic-rendering,ash-validation-smoke" --bin ash_vulkan_validation_smoke

      - name: Check SDL3 Glow multi-viewport example
        run: cargo check -p dear-imgui-examples --features "sdl3-glow-multi-viewport" --bin sdl3_glow_multi_viewport

      - name: Check SDL3 OpenGL multi-viewport example
        run: cargo check -p dear-imgui-examples --features "multi-viewport sdl3-opengl3" --bin sdl3_opengl_multi_viewport

      - name: Check SDL3 WGPU multi-viewport example
        run: cargo check -p dear-imgui-examples --features "sdl3-wgpu-multi-viewport" --bin sdl3_wgpu_multi_viewport

      - name: Check SDL3 Ash multi-viewport example
        run: cargo check -p dear-imgui-examples --no-default-features --features "sdl3-ash-multi-viewport" --bin sdl3_ash_multi_viewport

      - name: Check SDL3 Ash dynamic-rendering multi-viewport example
        run: cargo check -p dear-imgui-examples --no-default-features --features "sdl3-ash-multi-viewport,ash-dynamic-rendering" --bin sdl3_ash_multi_viewport

      - name: Check SDL3 GPU multi-viewport example
        run: cargo check -p dear-imgui-examples --features "sdl3-gpu-multi-viewport" --bin sdl3_sdlgpu_multi_viewport

      - name: Restore cached SDL3 runtime
        if: runner.os == 'Windows'
        run: >-
          python tools/ci/run_contract.py windows-sdl3-runtime
          --target-dir target
          --profile debug
          --github-path "$env:GITHUB_PATH"

      - name: Test SDL3 callback event handoff
        run: cargo nextest run -p dear-imgui-sdl3 --lib callback_events

      - name: Test SDL3 OpenGL multi-viewport route contracts
        run: >-
          cargo nextest run -p dear-imgui-sdl3 --lib
          --features "opengl3-renderer,multi-viewport"
          viewport_route_contract_tests

      - name: Test SDL3 GPU multi-viewport route contracts
        run: >-
          cargo nextest run -p dear-imgui-sdl3 --lib
          --features "sdlgpu3-renderer,multi-viewport"
          viewport_route_contract_tests

      - name: Test SDL3 GPU present-mode policy
        run: cargo nextest run -p dear-imgui-examples --lib --features "sdl3-gpu-multi-viewport" sdl3_gpu_present

      - name: Test SDL3 foreign pointer callback teardown
        run: cargo nextest run -p dear-imgui-sdl3 --lib --features "sdlgpu3-renderer,multi-viewport" pointer_callback_replacement_survives_renderer_shutdown

      - name: Test SDL3 original pointer callback lifecycle
        run: cargo nextest run -p dear-imgui-sdl3 --lib --features "sdlgpu3-renderer,multi-viewport" pointer_original_callback_is_invoked

      - name: Check SDL3 WGPU renderer example
        run: cargo check -p dear-imgui-examples --features "sdl3-platform" --bin sdl3_wgpu

      - name: Check SDLRenderer3 renderer example
        run: cargo check -p dear-imgui-examples --features "sdl3-sdlrenderer3" --bin sdl3_sdlrenderer3

      - name: Build interactive Test Engine example
        run: cargo build -p dear-imgui-examples --features "test-engine" --bin test_engine_integration

      - name: Check WGPU multi-viewport Test Engine smoke harness
        run: cargo check -p dear-imgui-examples --features "multi-viewport,test-engine" --bin wgpu_multi_viewport_smoke

      - name: Check SDL3 Glow multi-viewport Test Engine smoke harness
        run: cargo check -p dear-imgui-examples --features "sdl3-glow-multi-viewport,test-engine" --bin sdl3_glow_multi_viewport_smoke

      - name: Check test-engine (no capture)
        run: cargo check -p dear-imgui-test-engine --no-default-features

      - name: Test safe Test Engine runner contracts
        run: cargo nextest run -j 1 -p dear-imgui-test-engine --no-default-features

      - name: Test safe Test Engine capture contracts
        run: cargo nextest run -j 1 -p dear-imgui-test-engine --no-default-features --features capture

      - name: Check native stack-layout unified with the WASM feature
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
        run: cargo check -p dear-imgui-rs --lib --no-default-features --features wasm,stack-layout

      - name: Check native Test Engine unified with the WASM feature
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
        run: cargo check -p dear-imgui-rs --lib --no-default-features --features wasm,test-engine

      - name: Check native prebuilt unified with the WASM feature
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
        run: cargo check -p dear-imgui-rs --lib --no-default-features --features wasm,prebuilt

      - name: Check unified prebuilt and test-engine source profile
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          tools/ci/run_contract.py prebuilt-test-engine

      - name: Reject packaging source-only test-engine hooks
        if: runner.os == 'Linux'
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label package-test-engine
          --contains 'feature `test-engine` is source-only and cannot be packaged as a prebuilt core artifact'
          -- cargo check -p dear-imgui-sys --no-default-features --features package-bin,test-engine

  test-engine-sanitizers:
    name: Test Engine C ABI sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Refresh native package metadata
        run: sudo apt-get update

      - name: Install native build dependencies
        run: sudo apt-get install -y clang build-essential

      - name: Run Test Engine FFI boundary tests with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          CC: clang
          CXX: clang++
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          RUSTFLAGS: >-
            -Cdebuginfo=1
            -Cforce-frame-pointers=yes
            -Clinker=clang++
            -Clink-arg=-fsanitize=address
            -Clink-arg=-fsanitize=undefined
            -Clink-arg=-lstdc++
          IMGUI_SYS_FORCE_BUILD: "1"
        run: >-
          cargo nextest run -p dear-imgui-test-engine-sys
          --features capture --test ffi_boundary

      - name: Run Test Engine runner tests with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          CC: clang
          CXX: clang++
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          RUSTFLAGS: >-
            -Cdebuginfo=1
            -Cforce-frame-pointers=yes
            -Clinker=clang++
            -Clink-arg=-fsanitize=address
            -Clink-arg=-fsanitize=undefined
            -Clink-arg=-lstdc++
          IMGUI_SYS_FORCE_BUILD: "1"
        run: >-
          cargo nextest run -p dear-imgui-test-engine
          --features capture --test runner

  test-engine-runtime:
    name: Test Engine native runtime
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: test-engine-runtime
      gate_attempt: 1

  test-engine-runtime-retry:
    name: Test Engine native runtime retry
    needs: test-engine-runtime
    if: ${{ always() && needs.test-engine-runtime.outputs.retry_eligible == 'true' }}
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: test-engine-runtime
      gate_attempt: 2

  multi-viewport-runtime:
    name: Winit/WGPU multi-viewport runtime
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: multi-viewport-smoke
      gate_attempt: 1

  multi-viewport-runtime-retry:
    name: Winit/WGPU multi-viewport runtime retry
    needs: multi-viewport-runtime
    if: ${{ always() && needs.multi-viewport-runtime.outputs.retry_eligible == 'true' }}
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: multi-viewport-smoke
      gate_attempt: 2

  ash-vulkan-validation-runtime:
    name: Winit/Ash Vulkan validation runtime
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: ash-vulkan-validation-smoke
      gate_attempt: 1

  ash-vulkan-validation-runtime-retry:
    name: Winit/Ash Vulkan validation runtime retry
    needs: ash-vulkan-validation-runtime
    if: ${{ always() && needs.ash-vulkan-validation-runtime.outputs.retry_eligible == 'true' }}
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: ash-vulkan-validation-smoke
      gate_attempt: 2

  sdl3-glow-multi-viewport-runtime:
    name: SDL3/Glow multi-viewport runtime
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: sdl3-glow-multi-viewport-smoke
      gate_attempt: 1

  sdl3-glow-multi-viewport-runtime-retry:
    name: SDL3/Glow multi-viewport runtime retry
    needs: sdl3-glow-multi-viewport-runtime
    if: ${{ always() && needs.sdl3-glow-multi-viewport-runtime.outputs.retry_eligible == 'true' }}
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ github.sha }}
      contract: sdl3-glow-multi-viewport-smoke
      gate_attempt: 2

  binding-contract:
    name: Core and extension binding contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Install fixed LLVM toolchain
        run: >-
          python3 tools/ci/install_llvm.py
          --destination "${{ runner.temp }}/llvm"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          key: binding-contract

      - name: Test binding specification and provenance models
        run: cargo nextest run -p dear-imgui-build-support --features binding-spec

      - name: Verify exact vendored source provenance
        run: python3 tools/source_metadata.py verify

      - name: Verify exact binding provenance
        run: python3 tools/source_metadata.py verify-bindings

      - name: Regenerate and verify every maintained binding profile
        env:
          LIBCLANG_PATH: ${{ runner.temp }}/llvm/lib
        run: cargo run -p xtask -- verify-bindings --allow-dirty

      - name: Assert checked-in bindings did not drift
        run: >-
          git diff --exit-code --
          dear-imgui-sys/src/bindings_pregenerated.rs
          dear-imgui-sys/src/bindings_pregenerated_windows.rs
          dear-imgui-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-imgui-test-engine-sys/src/bindings_pregenerated.rs
          extensions/dear-implot-sys/src/bindings_pregenerated.rs
          extensions/dear-implot-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-implot3d-sys/src/bindings_pregenerated.rs
          extensions/dear-implot3d-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-imnodes-sys/src/bindings_pregenerated.rs
          extensions/dear-imnodes-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-node-editor-sys/src/bindings_pregenerated.rs
          extensions/dear-imguizmo-sys/src/bindings_pregenerated.rs
          extensions/dear-imguizmo-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-imguizmo-quat-sys/src/bindings_pregenerated.rs
          extensions/dear-imguizmo-quat-sys/src/wasm_bindings_pregenerated.rs

  source-contracts:
    name: MSRV and public API documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Initialize required nested submodules
        run: python3 tools/ci/update_submodules.py

      - name: Install current Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'

      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: 'false'
          key: source-contracts

      - name: Refresh Linux package metadata
        run: sudo apt-get update

      - name: Install Linux dependencies
        run: >-
          sudo apt-get install -y
          build-essential pkg-config
          libasound2-dev
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev libgl1-mesa-dev cmake

      - name: Check publishable non-Bevy crates at the declared MSRV
        run: >-
          cargo +1.92.0 check --workspace
          --exclude dear-imgui-bevy
          --exclude dear-imgui-examples
          --exclude dear-imgui-web-demo
          --exclude xtask

      - name: Test core public API documentation
        run: cargo +1.95.0 test --doc -p dear-imgui-rs --features multi-viewport

      - name: Test Winit public API documentation
        run: cargo +1.95.0 test --doc -p dear-imgui-winit --features multi-viewport

      - name: Test WGPU public API documentation
        run: cargo +1.95.0 test --doc -p dear-imgui-wgpu --features multi-viewport-winit

      - name: Test Glow public API documentation
        run: cargo +1.95.0 test --doc -p dear-imgui-glow --features multi-viewport

      - name: Test Ash public API documentation
        run: cargo +1.95.0 test --doc -p dear-imgui-ash --features multi-viewport-winit

      - name: Test SDL3 public API documentation
        run: cargo +1.95.0 test --doc -p dear-imgui-sdl3 --features multi-viewport

      - name: Test SDL3 OpenGL public API documentation
        if: runner.os == 'Linux'
        run: cargo +1.95.0 test --doc -p dear-imgui-sdl3 --features "opengl3-renderer,multi-viewport"

      - name: Test SDL3 GPU public API documentation
        if: runner.os == 'Linux'
        run: cargo +1.95.0 test --doc -p dear-imgui-sdl3 --features "sdlgpu3-renderer,multi-viewport"

  wgpu-routes:
    name: WGPU ${{ matrix.wgpu }} + ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wgpu: '27'
            platform: Winit
            features: wgpu-27,multi-viewport-winit
            lint_features: wgpu-27
          - wgpu: '28'
            platform: Winit
            features: wgpu-28,multi-viewport-winit
            lint_features: wgpu-28
          - wgpu: '29'
            platform: Winit
            features: wgpu-29,multi-viewport-winit
            lint_features: wgpu-29
          - wgpu: '30'
            platform: Winit
            features: wgpu-30,multi-viewport-winit
            lint_features: wgpu-30,multi-viewport-winit
          - wgpu: '30'
            platform: SDL3
            features: wgpu-30,multi-viewport-sdl3
            lint_features: wgpu-30,multi-viewport-sdl3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          key: wgpu-${{ matrix.wgpu }}-${{ matrix.platform }}

