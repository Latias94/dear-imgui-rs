        run: cargo fmt --all -- --check

  wasm-check:
    name: WASM bindings (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Reject WASI and Emscripten in the pure target resolver
        run: cargo nextest run -p dear-imgui-build-support --features binding-spec wasm_target_requires_the_explicit_provider_feature

      - name: Check explicit core WASM feature
        run: cargo check -p dear-imgui-rs --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check file browser WASM scan policy branches
        run: cargo check -p dear-file-browser --target wasm32-unknown-unknown --tests --no-default-features --features "imgui,dear-imgui-rs/wasm"

      - name: Reject core WASM target without the explicit feature
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-missing-feature
          --contains 'wasm32-unknown-unknown requires the explicit `wasm` feature'
          -- cargo check -p dear-imgui-sys --target wasm32-unknown-unknown --no-default-features

      - name: Reject native stack-layout injection on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-stack-layout
          --contains 'feature `stack-layout` is native-only and cannot be combined with WASM'
          -- cargo check -p dear-imgui-rs --target wasm32-unknown-unknown
          --no-default-features --features wasm,stack-layout

      - name: Reject native test-engine hooks on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-test-engine
          --contains 'feature `test-engine` is native source-only and cannot be combined with WASM'
          -- cargo check -p dear-imgui-rs --target wasm32-unknown-unknown
          --no-default-features --features wasm,test-engine

      - name: Reject native prebuilt artifacts on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-prebuilt
          --contains 'feature `prebuilt` is native-only and cannot be combined with WASM'
          -- cargo check -p dear-imgui-rs --target wasm32-unknown-unknown
          --no-default-features --features wasm,prebuilt

      - name: Validate checked-in extension WASM binding provenance
        run: cargo run -p xtask -- verify-bindings --check-only --allow-dirty

      - name: Check generated compatibility symbols on WASM
        run: >-
          cargo check
          -p dear-implot-sys
          -p dear-implot3d-sys
          -p dear-imnodes-sys
          --test binding_symbols
          --target wasm32-unknown-unknown
          --no-default-features
          --features dear-implot-sys/wasm,dear-implot3d-sys/wasm,dear-imnodes-sys/wasm

      - name: Build web demo crate for wasm32-unknown-unknown (core + extensions)
        run: cargo build -p dear-imgui-web-demo --target wasm32-unknown-unknown --no-default-features --features "web-backends,implot,implot3d,imnodes,imguizmo,imguizmo-quat"
