  wasm-check:
    name: WASM bindings (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up pinned Emscripten provider toolchain
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 5.0.1
          emsdk-version: 5.0.5

      - name: Reject WASI and Emscripten in the pure target resolver
        run: cargo nextest run -p dear-imgui-build-support --features binding-spec wasm_target_requires_the_explicit_provider_feature

      - name: Check explicit core WASM feature
        run: cargo check -p dear-imgui-rs --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check Glow renderer WASM provider
        run: cargo check -p dear-imgui-glow --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check ImNodes WASM safe API tests
        run: cargo check -p dear-imnodes --tests --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check CTE preview WASM safe API
        run: cargo check -p dear-imgui-cte --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check file browser WASM scan policy branches
        run: cargo check -p dear-file-browser --target wasm32-unknown-unknown --tests --no-default-features --features "imgui,dear-imgui-rs/wasm"

      - name: Reject core WASM target without the explicit feature
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-missing-feature
          --contains 'wasm32-unknown-unknown requires the explicit `wasm` feature'
          -- cargo check -p dear-imgui-sys --target wasm32-unknown-unknown --no-default-features

      - name: Reject native stack-layout injection on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-stack-layout
          --contains 'feature `stack-layout` is native-only and cannot be combined with WASM'
          -- cargo check -p dear-imgui-rs --target wasm32-unknown-unknown
          --no-default-features --features wasm,stack-layout

      - name: Reject native test-engine hooks on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-test-engine
          --contains 'feature `test-engine` is native source-only and cannot be combined with WASM'
          -- cargo check -p dear-imgui-rs --target wasm32-unknown-unknown
          --no-default-features --features wasm,test-engine

      - name: Reject the native ABI probe on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-abi-probe
          --contains 'feature `abi-probe` requires a native source build and cannot be combined with WASM or IMGUI_SYS_SKIP_CC'
          -- cargo check -p dear-imgui-sys --target wasm32-unknown-unknown
          --no-default-features --features wasm,abi-probe

      - name: Reject native prebuilt artifacts on WASM
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label wasm-prebuilt
          --contains 'feature `prebuilt` is native-only and cannot be combined with WASM'
          -- cargo check -p dear-imgui-rs --target wasm32-unknown-unknown
          --no-default-features --features wasm,prebuilt

      - name: Validate checked-in extension WASM binding provenance
        run: cargo run -p xtask -- verify-bindings --check-only --allow-dirty

      - name: Check generated compatibility symbols on WASM
        run: >-
          cargo check
          -p dear-implot-sys
          -p dear-implot3d-sys
          -p dear-imnodes-sys
          -p dear-imgui-cte-sys
          --test binding_symbols
          --target wasm32-unknown-unknown
          --no-default-features
          --features dear-implot-sys/wasm,dear-implot3d-sys/wasm,dear-imnodes-sys/wasm,dear-imgui-cte-sys/wasm

      - name: Build web demo crate for wasm32-unknown-unknown (core + extensions)
        run: cargo build -p dear-imgui-web-demo --target wasm32-unknown-unknown --no-default-features --features "web-backends,implot,implot3d,imnodes,imguizmo,imguizmo-quat,cte"

      - name: Build and structurally verify the Emscripten provider
        run: python3 -B tools/ci/verify_wasm_provider.py
