  wasm-check:
    name: WASM bindings (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Install LLVM (libclang) for bindgen
        uses: KyleMayes/install-llvm-action@v1
        with:
          directory: ${{ runner.temp }}/llvm
          cached: true
          version: '14.0'

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Reject WASI and Emscripten in the pure target resolver
        run: cargo nextest run -p dear-imgui-build-support --features binding-spec wasm_target_requires_the_explicit_provider_feature

      - name: Check explicit core WASM feature
        run: cargo check -p dear-imgui-rs --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check file browser WASM scan policy branches
        run: cargo check -p dear-file-browser --target wasm32-unknown-unknown --tests --no-default-features --features "imgui,dear-imgui-rs/wasm"

      - name: Reject core WASM target without the explicit feature
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check -p dear-imgui-sys --target wasm32-unknown-unknown --no-default-features 2>&1 | tee wasm-missing-feature.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::dear-imgui-sys unexpectedly accepted wasm32 without feature 'wasm'"
            exit 1
          fi
          # Match Cargo's literal backticks.
          # shellcheck disable=SC2016
          grep -F 'wasm32-unknown-unknown requires the explicit `wasm` feature' wasm-missing-feature.log

      - name: Reject native stack-layout injection on WASM
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check -p dear-imgui-rs --target wasm32-unknown-unknown --no-default-features --features wasm,stack-layout 2>&1 | tee wasm-stack-layout.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::dear-imgui-rs unexpectedly accepted WASM with native stack-layout"
            exit 1
          fi
          # Match rustc's literal backticks.
          # shellcheck disable=SC2016
          grep -F 'feature `stack-layout` is native-only and cannot be combined with WASM' wasm-stack-layout.log

      - name: Reject native test-engine hooks on WASM
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check -p dear-imgui-rs --target wasm32-unknown-unknown --no-default-features --features wasm,test-engine 2>&1 | tee wasm-test-engine.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::dear-imgui-rs unexpectedly accepted WASM with native test-engine hooks"
            exit 1
          fi
          # Match rustc's literal backticks.
          # shellcheck disable=SC2016
          grep -F 'feature `test-engine` is native source-only and cannot be combined with WASM' wasm-test-engine.log

      - name: Reject native prebuilt artifacts on WASM
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check -p dear-imgui-rs --target wasm32-unknown-unknown --no-default-features --features wasm,prebuilt 2>&1 | tee wasm-prebuilt.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::dear-imgui-rs unexpectedly accepted WASM with native prebuilt artifacts"
            exit 1
          fi
          # Match rustc's literal backticks.
          # shellcheck disable=SC2016
          grep -F 'feature `prebuilt` is native-only and cannot be combined with WASM' wasm-prebuilt.log

      - name: Generate WASM bindings for extensions (ImPlot/ImPlot3D/ImNodes/ImGuizmo/ImGuIZMO.quat)
        run: |
          cargo run -p xtask -- wasm-bindgen-implot
          cargo run -p xtask -- wasm-bindgen-implot3d
          cargo run -p xtask -- wasm-bindgen-imnodes
          cargo run -p xtask -- wasm-bindgen-imguizmo
          cargo run -p xtask -- wasm-bindgen-imguizmo-quat

      - name: Build web demo crate for wasm32-unknown-unknown (core + extensions)
        run: cargo build -p dear-imgui-web-demo --target wasm32-unknown-unknown --no-default-features --features "web-backends,implot,implot3d,imnodes,imguizmo,imguizmo-quat"
