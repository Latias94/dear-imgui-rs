          build-essential pkg-config
          libasound2-dev
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev libgl1-mesa-dev cmake

      - name: Enforce workflow portability policy
        run: python3 -B tools/ci/workflow_policy.py

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'SC2016:'

      - name: Test release tooling and source provenance
        run: python3 -B -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Package, unpack, and consume core crates
        run: python3 tools/ci/verify_packaged_core.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
