            full_sys: true
            runtime_path_policy: include
            unwind_policy: required
            msvc: false
          - lane: x64-gnullvm-crt-static
            target: x86_64-pc-windows-gnullvm
            target_dir: target/windows-gnullvm-x64-crt-static
            rustflags: -Cdebuginfo=0 -C target-feature=+crt-static
            llvm_prefix: x86_64-w64-mingw32
            expected_machine: coff-x86-64
            full_sys: true
            runtime_path_policy: exclude
            unwind_policy: forbidden
            msvc: false
          - lane: arm64-gnullvm-default
            target: aarch64-pc-windows-gnullvm
            target_dir: target/windows-gnullvm-arm64-default
            rustflags: -Cdebuginfo=0
            llvm_prefix: aarch64-w64-mingw32
            expected_machine: coff-arm64
            full_sys: true
            runtime_path_policy: none
            unwind_policy: required
            msvc: false
          - lane: arm64-msvc-md
