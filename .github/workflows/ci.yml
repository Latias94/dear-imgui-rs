          libasound2-dev
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev mesa-vulkan-drivers libgl1-mesa-dev cmake

      - name: Add wasm32 target
        run: rustup target add --toolchain stable wasm32-unknown-unknown

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run Bevy backend headless tests
        run: cargo +stable nextest run -p dear-imgui-bevy --no-default-features

      - name: Run Bevy backend default tests
        run: cargo +stable nextest run -p dear-imgui-bevy

      - name: Check Bevy backend render-only targets
        run: cargo +stable check -p dear-imgui-bevy --all-targets --no-default-features --features render

      - name: Check Bevy backend native multi-viewport implication
        run: cargo +stable check -p dear-imgui-bevy --all-targets --no-default-features --features multi-viewport

      - name: Run Bevy backend native multi-viewport tests
        run: cargo +stable nextest run -p dear-imgui-bevy --features multi-viewport

      - name: Lint Bevy backend native targets
        run: cargo +stable clippy -p dear-imgui-bevy --all-targets --features multi-viewport --no-deps -- -D warnings

      - name: Check Bevy backend default examples
        run: cargo +stable check -p dear-imgui-bevy --examples

      - name: Check Bevy backend native multi-viewport examples
        run: cargo +stable check -p dear-imgui-bevy --examples --features multi-viewport

      - name: Check Bevy backend rustdoc examples
        run: cargo +stable test --doc -p dear-imgui-bevy --features multi-viewport

      - name: Inspect Bevy backend package contents
        run: cargo +stable package -p dear-imgui-bevy --list

      - name: Check Bevy backend wasm (headless)
        run: cargo +stable check -p dear-imgui-bevy --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check Bevy backend wasm (default)
        run: cargo +stable check -p dear-imgui-bevy --target wasm32-unknown-unknown --features wasm

      - name: Reject Bevy multi-viewport through the core WASM contract
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label bevy-wasm-multi-viewport
          --contains 'The `multi-viewport` feature is not supported on wasm32 targets yet.'
          -- cargo +stable check -p dear-imgui-bevy --target wasm32-unknown-unknown
          --no-default-features --features wasm,multi-viewport

      - name: Run Bevy GPU composition tests
        run: cargo +stable nextest run -j 1 -p dear-imgui-bevy --no-default-features --features render,bevy-ui --test render_composition
        env:
          DEAR_IMGUI_BEVY_GPU_TESTS: "1"
          WGPU_BACKEND: vulkan
          WGPU_FORCE_FALLBACK_ADAPTER: "1"

