          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev libgl1-mesa-dev

      - name: Lint binding contract tooling without warnings
        run: cargo clippy -p dear-imgui-build-support --all-targets --features binding-spec -- -D warnings

      - name: Lint cross-platform release tooling without warnings
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Lint core multi-viewport callback ownership
        run: >-
          python3 tools/ci/run_contract.py clippy --
          -p dear-imgui-rs --lib --no-default-features --features multi-viewport
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Lint node editor blueprints route
        run: >-
          python3 tools/ci/run_contract.py clippy --
          -p dear-node-editor --lib --no-default-features --features blueprints
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

  bevy-backend:
    name: Bevy backend gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Refresh Linux package metadata
        run: sudo apt-get update

      - name: Install Linux deps
        run: >-
          sudo apt-get install -y
          build-essential pkg-config
          libasound2-dev
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev libgl1-mesa-dev cmake

      - name: Add wasm32 target
        run: rustup target add --toolchain stable wasm32-unknown-unknown

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Check Bevy backend core example
        run: cargo +stable check -p dear-imgui-bevy --example simple --features render

      - name: Check Bevy backend examples
        run: cargo +stable check -p dear-imgui-bevy --examples --features render

      - name: Check Bevy backend multi-viewport examples
        run: cargo +stable check -p dear-imgui-bevy --examples --features render,multi-viewport

      - name: Check Bevy backend ecosystem example
        run: cargo +stable check -p dear-imgui-bevy --example ecosystem --features render

      - name: Check Bevy backend plot controls example
        run: cargo +stable check -p dear-imgui-bevy --example bevy_plot_controls --features render

      - name: Check Bevy backend docs
        run: cargo +stable doc -p dear-imgui-bevy --no-deps --features render,multi-viewport
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "-D warnings"

      - name: Run Bevy backend core tests
        run: cargo +stable nextest run -p dear-imgui-bevy --no-default-features --lib --test helpers --test input --test lifecycle --test plugin

      - name: Run Bevy backend tests
        run: cargo +stable nextest run -p dear-imgui-bevy --features render

      - name: Check Bevy backend native multi-viewport platform bridge
        run: cargo +stable check -p dear-imgui-bevy --features multi-viewport

      - name: Run Bevy backend native multi-viewport platform bridge tests
        run: cargo +stable nextest run -p dear-imgui-bevy --features multi-viewport --test viewport

      - name: Check Bevy backend native multi-viewport
        run: cargo +stable check -p dear-imgui-bevy --features render,multi-viewport

      - name: Run Bevy backend native multi-viewport tests
        run: cargo +stable nextest run -p dear-imgui-bevy --features render,multi-viewport

      - name: Check Bevy backend wasm (core)
        run: cargo +stable check -p dear-imgui-bevy --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Check Bevy backend wasm (render)
        run: cargo +stable check -p dear-imgui-bevy --target wasm32-unknown-unknown --features render,wasm

  windows-platform-io-abi:
    name: PlatformIO C++ ABI (MSVC ${{ matrix.crt }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crt: md
            rustflags: -Cdebuginfo=0
          - crt: mt
            rustflags: -Cdebuginfo=0 -C target-feature=+crt-static
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: platform-io-${{ matrix.crt }}

      - name: Run exact C++ aggregate callback ABI probe
        run: cargo +stable nextest run -p dear-imgui-rs --features multi-viewport cpp_platform_io_probe_round_trips_all_aggregate_slots
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Run exact aggregate callback lifecycle sentinel
        run: cargo +stable nextest run -p dear-imgui-rs --features multi-viewport context_drop_clears_aggregate_callback_storage
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          RUSTFLAGS: ${{ matrix.rustflags }}

  sys-bindgen-defaults:
    name: Sys crates without bindgen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Assert default sys crates do not pull bindgen
        run: python3 tools/ci/run_contract.py no-default-bindgen

      - name: Run aggregate setter fallbacks without native C++ hooks
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
        run: cargo nextest run -p dear-imgui-sys aggregate_setters_without_cpp_hooks

      - name: Check sys crates without libclang or native C/C++
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
          IMPLOT_SYS_SKIP_CC: "1"
          IMNODES_SYS_SKIP_CC: "1"
          NODE_EDITOR_SYS_SKIP_CC: "1"
          IMPLOT3D_SYS_SKIP_CC: "1"
          IMGUIZMO_SYS_SKIP_CC: "1"
          IMGUIZMO_QUAT_SYS_SKIP_CC: "1"
          IMGUI_TEST_ENGINE_SYS_SKIP_CC: "1"
        run: >-
          cargo check
          -p dear-imgui-sys
          -p dear-implot-sys
          -p dear-imnodes-sys
          -p dear-node-editor-sys
          -p dear-implot3d-sys
          -p dear-imguizmo-sys
          -p dear-imguizmo-quat-sys
          -p dear-imgui-test-engine-sys

      - name: Check generated compatibility symbols on native without vendored sources
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
          IMPLOT_SYS_SKIP_CC: "1"
          IMPLOT3D_SYS_SKIP_CC: "1"
          IMNODES_SYS_SKIP_CC: "1"
        run: >-
          cargo check
          -p dear-implot-sys
          -p dear-implot3d-sys
          -p dear-imnodes-sys
          --test binding_symbols

      - name: Assert regeneration requires bindgen feature
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          DEAR_IMGUI_RS_REGEN_BINDINGS: "1"
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label regen-without-bindgen
          --contains 'regenerating bindings requires the `bindgen` feature'
          --contains='--features bindgen'
          -- cargo check -p dear-imgui-sys

  windows-vcpkg-native-deps:
    name: Windows vcpkg native dependency discovery
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Install native deps through vcpkg
        run: >-
          python tools/ci/run_contract.py windows-vcpkg
          --target x86_64-pc-windows-msvc
          --crt md
          --package freetype
          --package sdl3
          --runner-temp "$env:RUNNER_TEMP"
          --github-env "$env:GITHUB_ENV"

      - name: Check dear-imgui-sys FreeType via vcpkg fallback
        run: cargo check -p dear-imgui-sys --no-default-features --features freetype
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Test native dependency helper search order
        run: cargo test -p dear-imgui-build-support --features pkg-config,vcpkg --lib

      - name: Check SDL3 header discovery via vcpkg fallback
        run: >-
          python tools/ci/run_contract.py windows-sdl3-consumer
          --workspace "$env:RUNNER_TEMP\dear-imgui-native-deps-smoke"
          --repo-root "$env:GITHUB_WORKSPACE"

      - name: Check SDLRenderer3 backend with pkg-config unavailable
        run: cargo check -p dear-imgui-sdl3 --no-default-features --features sdlrenderer3-renderer
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

  windows-gnu:
    name: Windows GNU link check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-toolchain

      - name: Add MinGW64 to PATH
        run: >-
          python tools/ci/run_contract.py windows-mingw-env
          --msys2-root "${{ steps.msys2.outputs.msys2-location }}"
          --github-env "$env:GITHUB_ENV"
          --github-path "$env:GITHUB_PATH"

      - name: Add windows-gnu target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cargo test (no-run) - dear-imgui-sys (windows-gnu)
        run: cargo test -p dear-imgui-sys --target x86_64-pc-windows-gnu --no-run
        env:
          # Validate MinGW/GNU link flags (e.g. shell32) via an actual link step.
          IMGUI_SYS_FORCE_BUILD: "1"
          # Pin tool paths based on MSYS2 install location (varies: D:\a\_temp\msys64 or C:\msys64).
          # Use the mingw64 environment tools (gcc/g++/ar) which target x86_64-w64-mingw32.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: '${{ env.MINGW_BIN }}\gcc.exe'
          CC_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\gcc.exe'
          CXX_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\g++.exe'
          AR_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\ar.exe'

      - name: Verify windows-gnu binary does not import libstdc++
        run: >-
          python tools/ci/run_contract.py windows-mingw-imports
          --deps "target\x86_64-pc-windows-gnu\debug\deps"
          --objdump "$env:MINGW_BIN\objdump.exe"
          --evidence "target\ci-evidence\windows-gnu\mingw-imports.txt"

  ffi-cross-check:
    name: FFI signedness check (armv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Add armv7 target
        run: rustup target add armv7-unknown-linux-gnueabihf

      - name: Cargo check (armv7)
        run: cargo check -p dear-imgui-rs -p dear-implot -p dear-imnodes -p dear-node-editor --target armv7-unknown-linux-gnueabihf
        env:
          # This job is a type-check sentinel for `c_char` signedness (u8 vs i8).
          # We don't need to link any native C/C++ code here, so skip cc/cmake builds.
          IMGUI_SYS_SKIP_CC: "1"
          IMPLOT_SYS_SKIP_CC: "1"
          IMNODES_SYS_SKIP_CC: "1"
          NODE_EDITOR_SYS_SKIP_CC: "1"

  apple-mobile-check:
    name: Apple mobile compile check (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Refresh Homebrew package metadata
        run: brew update

