name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # Reduce disk usage in CI (helps avoid "No space left on device" from LLVM/rustc).
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-Cdebuginfo=0"
  # Existing workspace-wide lint debt. Broad Clippy routes deny every warning except this
  # explicit baseline; new release and binding tooling below has no allowances.
  CLIPPY_HISTORICAL_LINTS: >-
    -A dead_code
    -A clippy::assertions_on_constants
    -A clippy::collapsible_if
    -A clippy::collapsible_match
    -A clippy::default_constructed_unit_structs
    -A clippy::derivable_impls
    -A clippy::doc_lazy_continuation
    -A clippy::drop_non_drop
    -A clippy::explicit_auto_deref
    -A clippy::explicit_counter_loop
    -A clippy::field_reassign_with_default
    -A clippy::get_first
    -A clippy::if_same_then_else
    -A clippy::items_after_test_module
    -A clippy::large_enum_variant
    -A clippy::let_and_return
    -A clippy::manual_c_str_literals
    -A clippy::manual_div_ceil
    -A clippy::manual_is_multiple_of
    -A clippy::manual_unwrap_or
    -A clippy::manual_unwrap_or_default
    -A clippy::missing_const_for_thread_local
    -A clippy::missing_safety_doc
    -A clippy::module_inception
    -A clippy::needless_borrow
    -A clippy::needless_lifetimes
    -A clippy::needless_option_as_deref
    -A clippy::needless_range_loop
    -A clippy::new_ret_no_self
    -A clippy::new_without_default
    -A clippy::nonminimal_bool
    -A clippy::obfuscated_if_else
    -A clippy::question_mark
    -A clippy::redundant_closure
    -A clippy::result_large_err
    -A clippy::should_implement_trait
    -A clippy::single_match
    -A clippy::too_many_arguments
    -A clippy::type_complexity
    -A clippy::unnecessary_cast
    -A clippy::unnecessary_lazy_evaluations
    -A clippy::useless_conversion
    -A clippy::vec_box
    -A clippy::wrong_self_convention

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libfreetype6-dev \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev cmake

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew update
          # CMake is needed by various -sys crates; SDL3 is required by the
          # dear-imgui-sdl3 backend on macOS (we rely on system headers/libs
          # instead of building SDL3 from source here).
          brew install cmake freetype pkg-config sdl3

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: choco install -y cmake

      - name: Build workspace (native)
        run: cargo build --workspace --exclude dear-imgui-examples --exclude dear-imgui-web-demo --exclude xtask
        env:
          # Force building from source in CI for stability
          IMGUI_SYS_FORCE_BUILD: "1"
          IMPLOT_SYS_FORCE_BUILD: "1"
          IMNODES_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"
          IMGUIZMO_SYS_FORCE_BUILD: "1"

      - name: Test cross-platform release tooling
        run: cargo nextest run -p xtask

      - name: Check FreeType feature through native package metadata
        if: runner.os != 'Windows'
        run: cargo check -p dear-imgui-sys --no-default-features --features freetype
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Run dear-imgui-rs multi-viewport acceptance tests
        run: cargo nextest run -p dear-imgui-rs --features multi-viewport

      - name: Run reflection acceptance tests
        run: cargo nextest run -p dear-imgui-reflect --features glam,mint

      - name: Run file browser acceptance tests
        run: cargo nextest run -p dear-file-browser

      - name: Run dear-app lifecycle acceptance tests
        run: cargo nextest run -p dear-app

      - name: Run winit backend multi-viewport tests
        run: cargo nextest run -p dear-imgui-winit --lib --features "multi-viewport"

      - name: Build dear-app with all add-ons
        run: cargo build -p dear-app --features "implot imnodes implot3d"

      - name: Build examples (all extensions)
        run: cargo build -p dear-imgui-examples --features "imguizmo imnodes implot reflect implot3d imguizmo-quat"

      - name: Check multi-viewport examples
        run: |
          cargo check -p dear-imgui-examples --features "multi-viewport" --bin multi_viewport_wgpu --bin multi_viewport_ash
          cargo check -p dear-imgui-examples --features "multi-viewport sdl3-platform" --bin sdl3_glow_multi_viewport
          cargo check -p dear-imgui-examples --features "multi-viewport sdl3-opengl3" --bin sdl3_opengl_multi_viewport
          cargo check -p dear-imgui-examples --features "sdl3-wgpu-multi-viewport" --bin sdl3_wgpu_multi_viewport
          cargo check -p dear-imgui-examples --features "sdl3-ash-multi-viewport" --bin sdl3_ash_multi_viewport

      - name: Check SDL3 renderer examples
        run: |
          cargo check -p dear-imgui-examples --features "sdl3-platform" --bin sdl3_wgpu
          cargo check -p dear-imgui-examples --features "sdl3-sdlrenderer3" --bin sdl3_sdlrenderer

      - name: Build examples (test-engine)
        run: cargo build -p dear-imgui-examples --features "test-engine" --bin imgui_test_engine_basic

      - name: Check WGPU multi-viewport Test Engine smoke harness
        run: cargo check -p dear-imgui-examples --features "multi-viewport,test-engine" --bin multi_viewport_wgpu

      - name: Check test-engine (no capture)
        run: cargo check -p dear-imgui-test-engine --no-default-features

      - name: Check native-only features unified with the WASM feature on native targets
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
        run: |
          cargo check -p dear-imgui-rs --lib --no-default-features --features wasm,stack-layout
          cargo check -p dear-imgui-rs --lib --no-default-features --features wasm,test-engine
          cargo check -p dear-imgui-rs --lib --no-default-features --features wasm,prebuilt

      - name: Check unified prebuilt and test-engine source profile
        shell: bash
        run: |
          set -euo pipefail
          invalid_prebuilt="$RUNNER_TEMP/dear-imgui-invalid-prebuilt"
          mkdir -p "$invalid_prebuilt"
          : > "$invalid_prebuilt/libdear_imgui.a"
          : > "$invalid_prebuilt/dear_imgui.lib"
          IMGUI_SYS_LIB_DIR="$invalid_prebuilt" \
            cargo check -p dear-imgui-rs --lib --no-default-features --features prebuilt,test-engine

      - name: Reject packaging source-only test-engine hooks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo check -p dear-imgui-sys --no-default-features --features package-bin,test-engine 2>&1 | tee package-test-engine.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::dear-imgui-sys unexpectedly packaged source-only test-engine hooks"
            exit 1
          fi
          grep -F 'feature `test-engine` is source-only and cannot be packaged as a prebuilt core artifact' package-test-engine.log

  binding-contract:
    name: Core binding contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install fixed LLVM toolchain
        uses: KyleMayes/install-llvm-action@v1
        with:
          directory: ${{ runner.temp }}/llvm
          cached: true
          version: '14.0'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: core-binding-contract

      - name: Test binding specification and provenance models
        run: cargo nextest run -p dear-imgui-build-support --features binding-spec

      - name: Verify exact vendored source provenance
        run: python3 tools/source_metadata.py verify

      - name: Verify high-level API coverage policy
        run: python3 tools/api_surface_report.py --check

      - name: Regenerate and verify every core binding profile
        run: cargo run -p xtask -- verify-bindings --allow-dirty

      - name: Assert checked-in core bindings did not drift
        run: |
          git diff --exit-code -- \
            dear-imgui-sys/src/bindings_pregenerated.rs \
            dear-imgui-sys/src/bindings_pregenerated_windows.rs \
            dear-imgui-sys/src/wasm_bindings_pregenerated.rs

  wgpu-routes:
    name: WGPU ${{ matrix.wgpu }} + ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wgpu: '27'
            platform: Winit
            features: wgpu-27,multi-viewport-winit
            lint_features: wgpu-27
          - wgpu: '28'
            platform: Winit
            features: wgpu-28,multi-viewport-winit
            lint_features: wgpu-28
          - wgpu: '29'
            platform: Winit
            features: wgpu-29,multi-viewport-winit
            lint_features: wgpu-29
          - wgpu: '30'
            platform: Winit
            features: wgpu-30,multi-viewport-winit
            lint_features: wgpu-30,multi-viewport-winit
          - wgpu: '30'
            platform: SDL3
            features: wgpu-30,multi-viewport-sdl3
            lint_features: wgpu-30,multi-viewport-sdl3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: wgpu-${{ matrix.wgpu }}-${{ matrix.platform }}

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev

      - name: Check exact WGPU route
        run: cargo check -p dear-imgui-wgpu --lib --no-default-features --features "${{ matrix.features }}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Check opt-in WGPU tracing route
        if: matrix.wgpu == '30' && matrix.platform == 'Winit'
        run: cargo check -p dear-imgui-wgpu --lib --no-default-features --features wgpu-30,tracing
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Test exact WGPU route
        run: cargo nextest run -p dear-imgui-wgpu --lib --no-default-features --features "${{ matrix.features }}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Lint exact WGPU release route
        shell: bash
        run: |
          set -euo pipefail
          read -r -a historical_lints <<< "$CLIPPY_HISTORICAL_LINTS"
          cargo clippy -p dear-imgui-wgpu --all-targets --no-default-features --features "${{ matrix.lint_features }}" -- \
            -D warnings "${historical_lints[@]}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

  ash-routes:
    name: Ash ${{ matrix.platform }} + ${{ matrix.rendering }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Winit
            rendering: classic
            features: multi-viewport-winit
          - platform: Winit
            rendering: dynamic
            features: multi-viewport-winit,dynamic-rendering
          - platform: SDL3
            rendering: classic
            features: multi-viewport-sdl3
          - platform: SDL3
            rendering: dynamic
            features: multi-viewport-sdl3,dynamic-rendering
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: ash-${{ matrix.platform }}-${{ matrix.rendering }}

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev

      - name: Check exact Ash route
        run: cargo check -p dear-imgui-ash --lib --no-default-features --features "${{ matrix.features }}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Test exact Ash route including NoRendererClear policy
        run: cargo nextest run -p dear-imgui-ash --lib --no-default-features --features "${{ matrix.features }}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Lint exact classic Ash release route
        if: matrix.rendering == 'classic'
        shell: bash
        run: |
          set -euo pipefail
          read -r -a historical_lints <<< "$CLIPPY_HISTORICAL_LINTS"
          cargo clippy -p dear-imgui-ash --all-targets --no-default-features --features "${{ matrix.features }}" -- \
            -D warnings "${historical_lints[@]}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

  feature-conflict-contracts:
    name: Mutually exclusive feature contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: feature-conflict-contracts

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev

      - name: Reject mutually exclusive renderer features
        shell: bash
        run: |
          set -euo pipefail

          expect_failure() {
            local name="$1"
            local expected="$2"
            shift 2
            local log="$RUNNER_TEMP/$name.log"
            if "$@" >"$log" 2>&1; then
              echo "::error::$name unexpectedly succeeded"
              exit 1
            fi
            if ! grep -Fq "$expected" "$log"; then
              cat "$log"
              echo "::error::$name failed without the expected compile_error contract"
              exit 1
            fi
            echo "Verified expected failure: $expected"
          }

          expect_failure \
            wgpu-dual-major \
            "Features \`wgpu-27\`, \`wgpu-28\`, \`wgpu-29\`, and \`wgpu-30\` are mutually exclusive; enable only one." \
            cargo check -p dear-imgui-wgpu --lib --no-default-features --features wgpu-29,wgpu-30

          expect_failure \
            wgpu-dual-platform \
            "Features \`multi-viewport-winit\` and \`multi-viewport-sdl3\` are mutually exclusive; enable only one." \
            cargo check -p dear-imgui-wgpu --lib --no-default-features --features wgpu-30,multi-viewport-winit,multi-viewport-sdl3

          expect_failure \
            ash-dual-platform \
            "dear-imgui-ash cannot enable both \`multi-viewport-winit\` and \`multi-viewport-sdl3\`; select one platform surface adapter" \
            cargo check -p dear-imgui-ash --lib --no-default-features --features multi-viewport-winit,multi-viewport-sdl3
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

  node-editor-normal:
    name: Node editor normal profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: node-editor-normal

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev

      - name: Check node editor without stack-layout injection
        run: cargo check -p dear-node-editor --lib --no-default-features
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

      - name: Check normal node editor basic example
        run: cargo check -p dear-imgui-examples --bin node_editor_basic --no-default-features --features node-editor
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

  stack-layout-profiles:
    name: Stack layout ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [core, blueprints]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: stack-layout-${{ matrix.profile }}

      - name: Install Linux deps
        if: matrix.profile == 'blueprints'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev

      - name: Check standalone core stack-layout profile
        if: matrix.profile == 'core'
        run: cargo check -p dear-imgui-rs --lib --no-default-features --features stack-layout
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Test standalone core stack-layout profile
        if: matrix.profile == 'core'
        run: cargo nextest run -p dear-imgui-rs --no-default-features --features stack-layout
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Check node editor blueprints profile
        if: matrix.profile == 'blueprints'
        run: cargo check -p dear-node-editor --lib --no-default-features --features blueprints
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

      - name: Test node editor blueprints profile
        if: matrix.profile == 'blueprints'
        run: cargo nextest run -p dear-node-editor --no-default-features --features blueprints
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

      - name: Check node editor blueprints showcase
        if: matrix.profile == 'blueprints'
        run: cargo check -p dear-imgui-examples --bin node_editor_showcase --no-default-features --features node-editor-blueprints
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

  clippy-default:
    name: Clippy default workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: clippy-default

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfreetype6-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev

      - name: Lint default workspace routes
        run: |
          set -euo pipefail
          read -r -a historical_lints <<< "$CLIPPY_HISTORICAL_LINTS"
          cargo clippy --workspace --all-targets \
            --exclude dear-imgui-examples \
            --exclude dear-imgui-web-demo \
            --exclude xtask -- \
            -D warnings "${historical_lints[@]}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          IMPLOT_SYS_FORCE_BUILD: "1"
          IMNODES_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"
          IMGUIZMO_SYS_FORCE_BUILD: "1"

  clippy-focused:
    name: Clippy focused feature routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: clippy-focused

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libudev-dev \
            mesa-common-dev libgl1-mesa-dev

      - name: Lint binding contract tooling without warnings
        run: cargo clippy -p dear-imgui-build-support --all-targets --features binding-spec -- -D warnings

      - name: Lint cross-platform release tooling without warnings
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Lint core multi-viewport callback ownership
        run: |
          set -euo pipefail
          read -r -a historical_lints <<< "$CLIPPY_HISTORICAL_LINTS"
          cargo clippy -p dear-imgui-rs --lib --no-default-features --features multi-viewport -- \
            -D warnings "${historical_lints[@]}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Lint node editor blueprints route
        run: |
          set -euo pipefail
          read -r -a historical_lints <<< "$CLIPPY_HISTORICAL_LINTS"
          cargo clippy -p dear-node-editor --lib --no-default-features --features blueprints -- \
            -D warnings "${historical_lints[@]}"
        env:
          IMGUI_SYS_FORCE_BUILD: "1"
          NODE_EDITOR_SYS_FORCE_BUILD: "1"

