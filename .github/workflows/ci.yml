        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust 1.95.0 and target standard library
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Enter the Arm64 MSVC developer environment
        if: matrix.msvc == true
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64_arm64

      - name: Install cargo-nextest
        if: matrix.runtime_path_policy != 'none'
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          key: windows-source-abi-${{ matrix.lane }}

      - name: Download and verify llvm-mingw 20260616
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260616-ucrt-x86_64.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260616'
          Invoke-WebRequest `
            -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip' `
            -OutFile $archive `
            -ConnectionTimeoutSeconds 30 `
            -OperationTimeoutSeconds 600 `
            -MaximumRetryCount 2 `
            -RetryIntervalSec 5

          $expectedSha256 = 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "llvm-mingw SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $toolchainRoots = @(
            Get-ChildItem -Path $extractRoot -Directory |
              Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'bin\llvm-objdump.exe') -PathType Leaf } |
              ForEach-Object { $_.FullName } |
              Sort-Object -Unique
          )
          if ($toolchainRoots.Count -ne 1) {
            throw "Expected exactly one extracted llvm-mingw root, found $($toolchainRoots.Count)"
          }

          $toolchainRoot = $toolchainRoots[0]
          $toolchainBin = Join-Path $toolchainRoot 'bin'
          "LLVM_MINGW_ROOT=$toolchainRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_MINGW_BIN=$toolchainBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure the gnullvm compiler and linker
        if: matrix.llvm_prefix != ''
        run: |
          $prefix = '${{ matrix.llvm_prefix }}'
          $cc = Join-Path $env:LLVM_MINGW_BIN "$prefix-clang.exe"
          $cxx = Join-Path $env:LLVM_MINGW_BIN "$prefix-clang++.exe"
          $ar = Join-Path $env:LLVM_MINGW_BIN 'llvm-ar.exe'
          foreach ($tool in @($cc, $cxx, $ar)) {
            if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "Required llvm-mingw tool was not found: $tool"
            }
          }

          $targetKey = '${{ matrix.target }}'.Replace('-', '_')
          $cargoTargetKey = $targetKey.ToUpperInvariant()
          "CARGO_TARGET_${cargoTargetKey}_LINKER=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_${targetKey}=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX_${targetKey}=$cxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_${targetKey}=$ar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Final-link the configured native sentinels
        run: |
          $sentinels = @(
            Get-Content -Raw tools/ci/windows_source_sentinels.json |
              ConvertFrom-Json
          )
          if ('${{ matrix.full_sys }}' -ne 'true') {
            $sentinels = @(
              $sentinels |
                Where-Object { $_.package -eq 'dear-imgui-sys' }
            )
          }
          foreach ($sentinel in $sentinels) {
            cargo +1.95.0 test `
              -p $sentinel.package `
              --test $sentinel.test `
              --target "$env:CI_TARGET" `
              --no-run
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Inspect linked PE machine types and runtime imports
        run: |
          $deps = Join-Path $env:CARGO_TARGET_DIR "$env:CI_TARGET\debug\deps"
          $evidence = "target\ci-evidence\windows-source-abi\${{ matrix.lane }}\pe.txt"
          $objdump = Join-Path $env:LLVM_MINGW_BIN 'llvm-objdump.exe'
          $sentinels = @(
            Get-Content -Raw tools/ci/windows_source_sentinels.json |
              ConvertFrom-Json
          )
          if ('${{ matrix.full_sys }}' -ne 'true') {
            $sentinels = @(
              $sentinels |
                Where-Object { $_.package -eq 'dear-imgui-sys' }
            )
          }
          $binaryPatterns = @($sentinels | ForEach-Object { $_.binary_pattern })

          $contractArgs = @(
            'tools/ci/run_contract.py',
            'windows-pe-evidence',
            '--deps', $deps,
            '--objdump', $objdump,
            '--evidence', $evidence,
            '--expected-machine', '${{ matrix.expected_machine }}'
          )
          foreach ($pattern in $binaryPatterns) {
            $contractArgs += @('--binary-pattern', $pattern)
          }
          foreach ($forbiddenImport in @('libstdc++-6.dll', 'libc++.dll', 'libc++abi.dll', 'libwinpthread-1.dll')) {
            $contractArgs += @('--forbid-import', $forbiddenImport)
          }
          switch ('${{ matrix.unwind_policy }}') {
            'required' {
              $contractArgs += @('--require-import', 'libunwind.dll')
            }
            'forbidden' {
              $contractArgs += @('--forbid-import', 'libunwind.dll')
            }
            'none' {}
            default {
              throw "Unknown unwind policy: ${{ matrix.unwind_policy }}"
            }
          }

          python @contractArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run x64 native and aggregate ABI sentinels
        if: matrix.runtime_path_policy != 'none'
        run: |
          $separator = [IO.Path]::PathSeparator
          $runtimeBin = $env:LLVM_MINGW_BIN.TrimEnd('\')
          switch ('${{ matrix.runtime_path_policy }}') {
            'include' {
              $env:PATH = "$runtimeBin$separator$env:PATH"
            }
            'exclude' {
              $pathEntries = @(
                $env:PATH.Split($separator) |
                  Where-Object { $_.TrimEnd('\') -ne $runtimeBin }
              )
              $env:PATH = $pathEntries -join $separator
              if ($env:PATH.Split($separator).TrimEnd('\') -contains $runtimeBin) {
                throw 'The llvm-mingw runtime directory remained on PATH for the crt-static lane'
              }
            }
            default {
              throw "Unknown runtime PATH policy: ${{ matrix.runtime_path_policy }}"
            }
          }

          cargo +1.95.0 nextest run -j 1 `
            --target "$env:CI_TARGET" `
            -p dear-imgui-sys `
            --test numeric_contract
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          cargo +1.95.0 nextest run -j 1 `
            --target "$env:CI_TARGET" `
            -p dear-imgui-rs `
            --features multi-viewport,abi-probe `
            cpp_platform_io_probe_round_trips_all_aggregate_slots `
            cpp_public_aggregate_layout_probe_matches_rust `
            public_aggregate_layout_probe_rejects_an_abi_mismatch `
            context_drop_clears_aggregate_callback_storage
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Retain Windows PE evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-source-abi-${{ matrix.lane }}
          path: target/ci-evidence/windows-source-abi/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14

  sys-bindgen-defaults:
    name: Sys crates without bindgen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - name: Assert default sys crates do not pull bindgen
        run: python3 tools/ci/run_contract.py no-default-bindgen

      - name: Run aggregate setter fallbacks without native C++ hooks
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
        run: cargo nextest run -p dear-imgui-sys aggregate_setters_without_cpp_hooks

      - name: Check sys crates without libclang or native C/C++
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
          IMPLOT_SYS_SKIP_CC: "1"
          IMNODES_SYS_SKIP_CC: "1"
          NODE_EDITOR_SYS_SKIP_CC: "1"
          IMPLOT3D_SYS_SKIP_CC: "1"
          IMGUIZMO_SYS_SKIP_CC: "1"
          IMGUIZMO_QUAT_SYS_SKIP_CC: "1"
          IMGUI_TEST_ENGINE_SYS_SKIP_CC: "1"
        run: >-
          cargo check
          -p dear-imgui-sys
          -p dear-implot-sys
          -p dear-imnodes-sys
          -p dear-node-editor-sys
          -p dear-implot3d-sys
          -p dear-imguizmo-sys
          -p dear-imguizmo-quat-sys
          -p dear-imgui-test-engine-sys

      - name: Check generated compatibility symbols on native without vendored sources
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
          IMPLOT_SYS_SKIP_CC: "1"
          IMPLOT3D_SYS_SKIP_CC: "1"
          IMNODES_SYS_SKIP_CC: "1"
        run: >-
          cargo check
          -p dear-implot-sys
          -p dear-implot3d-sys
          -p dear-imnodes-sys
          --test binding_symbols

      - name: Assert regeneration requires bindgen feature
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          DEAR_IMGUI_RS_REGEN_BINDINGS: "1"
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label regen-without-bindgen
          --contains 'regenerating bindings requires the `bindgen` feature'
          --contains='--features bindgen'
          -- cargo check -p dear-imgui-sys

      - name: Reject packaging the source-only ABI probe
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label package-bin-abi-probe
          --contains 'feature `abi-probe` is CI-only and cannot be packaged as a prebuilt core artifact'
          -- cargo check -p dear-imgui-sys --no-default-features --features package-bin,abi-probe

      - name: Reject the ABI probe when native compilation is disabled
        env:
          IMGUI_SYS_SKIP_CC: "1"
        run: >-
          python3 tools/ci/run_contract.py expect-failure
          --label abi-probe-without-native-build
          --contains 'feature `abi-probe` requires a native source build and cannot be combined with WASM or IMGUI_SYS_SKIP_CC'
          -- cargo check -p dear-imgui-sys --no-default-features --features abi-probe

  windows-vcpkg-native-deps:
    name: Windows vcpkg native dependency discovery
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Install native deps through vcpkg
        run: >-
          python tools/ci/run_contract.py windows-vcpkg
          --target x86_64-pc-windows-msvc
          --crt md
          --package freetype
          --package sdl3
          --runner-temp "$env:RUNNER_TEMP"
          --github-env "$env:GITHUB_ENV"

      - name: Check dear-imgui-sys FreeType via vcpkg fallback
        run: cargo check -p dear-imgui-sys --no-default-features --features freetype
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Test native dependency helper search order
        run: cargo test -p dear-imgui-build-support --features pkg-config,vcpkg --lib

      - name: Check SDL3 header discovery via vcpkg fallback
        run: >-
          python tools/ci/run_contract.py windows-sdl3-consumer
          --workspace "$env:RUNNER_TEMP\dear-imgui-native-deps-smoke"
          --repo-root "$env:GITHUB_WORKSPACE"

      - name: Check SDLRenderer3 backend with pkg-config unavailable
        run: cargo check -p dear-imgui-sdl3 --no-default-features --features sdlrenderer3-renderer
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

  windows-gnu:
    name: Windows GNU link check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        id: msys2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-toolchain

      - name: Add MinGW64 to PATH
        run: >-
          python tools/ci/run_contract.py windows-mingw-env
          --msys2-root "${{ steps.msys2.outputs.msys2-location }}"
          --github-env "$env:GITHUB_ENV"
          --github-path "$env:GITHUB_PATH"

      - name: Add windows-gnu target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cargo test (no-run) - dear-imgui-sys (windows-gnu)
        run: cargo test -p dear-imgui-sys --target x86_64-pc-windows-gnu --no-run
        env:
          # Validate MinGW/GNU link flags (e.g. shell32) via an actual link step.
          IMGUI_SYS_FORCE_BUILD: "1"
          # Pin tool paths based on MSYS2 install location (varies: D:\a\_temp\msys64 or C:\msys64).
          # Use the mingw64 environment tools (gcc/g++/ar) which target x86_64-w64-mingw32.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: '${{ env.MINGW_BIN }}\gcc.exe'
          CC_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\gcc.exe'
          CXX_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\g++.exe'
          AR_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\ar.exe'

      - name: Verify windows-gnu binary does not import libstdc++
        run: >-
          python tools/ci/run_contract.py windows-mingw-imports
          --deps "target\x86_64-pc-windows-gnu\debug\deps"
          --objdump "$env:MINGW_BIN\objdump.exe"
          --evidence "target\ci-evidence\windows-gnu\mingw-imports.txt"

  ffi-cross-check:
    name: FFI signedness check (armv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
