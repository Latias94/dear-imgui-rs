  sys-bindgen-defaults:
    name: Sys crates without bindgen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Assert default sys crates do not pull bindgen
        shell: bash
        run: |
          set -euo pipefail

          crates=(
            dear-imgui-sys
            dear-implot-sys
            dear-imnodes-sys
            dear-node-editor-sys
            dear-implot3d-sys
            dear-imguizmo-sys
            dear-imguizmo-quat-sys
            dear-imgui-test-engine-sys
          )

          for crate in "${crates[@]}"; do
            for dep in bindgen clang-sys; do
              out="$(mktemp)"
              if cargo tree -p "$crate" --target all -i "$dep" >"$out" 2>&1; then
                cat "$out"
                echo "::error::$crate unexpectedly depends on $dep by default"
                exit 1
              fi
              if ! grep -q "did not match any packages" "$out"; then
                cat "$out"
                echo "::error::cargo tree failed unexpectedly while checking $crate for $dep"
                exit 1
              fi
            done
          done

      - name: Run aggregate setter fallbacks without native C++ hooks
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
        run: cargo nextest run -p dear-imgui-sys aggregate_setters_without_cpp_hooks

      - name: Check sys crates without libclang or native C/C++
        shell: bash
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          IMGUI_SYS_SKIP_CC: "1"
          IMPLOT_SYS_SKIP_CC: "1"
          IMNODES_SYS_SKIP_CC: "1"
          NODE_EDITOR_SYS_SKIP_CC: "1"
          IMPLOT3D_SYS_SKIP_CC: "1"
          IMGUIZMO_SYS_SKIP_CC: "1"
          IMGUIZMO_QUAT_SYS_SKIP_CC: "1"
          IMGUI_TEST_ENGINE_SYS_SKIP_CC: "1"
        run: |
          set -euo pipefail
          cargo check \
            -p dear-imgui-sys \
            -p dear-implot-sys \
            -p dear-imnodes-sys \
            -p dear-node-editor-sys \
            -p dear-implot3d-sys \
            -p dear-imguizmo-sys \
            -p dear-imguizmo-quat-sys \
            -p dear-imgui-test-engine-sys

      - name: Assert regeneration requires bindgen feature
        shell: bash
        env:
          LIBCLANG_PATH: ${{ github.workspace }}/ci-missing-libclang
          DEAR_IMGUI_RS_REGEN_BINDINGS: "1"
        run: |
          set -euo pipefail
          set +e
          cargo check -p dear-imgui-sys >regen-without-bindgen.log 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            cat regen-without-bindgen.log
            echo "::error::binding regeneration unexpectedly succeeded without the bindgen feature"
            exit 1
          fi
          # Match Cargo's literal backticks.
          # shellcheck disable=SC2016
          grep -F 'regenerating bindings requires the `bindgen` feature' regen-without-bindgen.log
          grep -F -- '--features bindgen' regen-without-bindgen.log

  windows-vcpkg-native-deps:
    name: Windows vcpkg native dependency discovery
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Install native deps through vcpkg
        shell: pwsh
        run: |
          vcpkg install freetype:x64-windows-static-md sdl3:x64-windows-static-md

          $vcpkgExe = (Get-Command vcpkg -ErrorAction Stop).Source
          $candidates = @(
            $env:VCPKG_ROOT,
            $env:VCPKG_INSTALLATION_ROOT,
            (Split-Path -Parent $vcpkgExe)
          ) | Where-Object { $_ } | Select-Object -Unique
          $root = $candidates | Where-Object { Test-Path (Join-Path $_ '.vcpkg-root') } | Select-Object -First 1
          if (-not $root) {
            Write-Host "vcpkg.exe: $vcpkgExe"
            Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
            Write-Host "VCPKG_INSTALLATION_ROOT: $env:VCPKG_INSTALLATION_ROOT"
            throw 'VCPKG root not found in environment or next to vcpkg.exe.'
          }

          # vcpkg-rs 0.2.x still reads installed\vcpkg\updates. Modern vcpkg
          # installs may create installed\vcpkg\status without creating the
          # updates directory, which otherwise makes vcpkg-rs fail before it
          # can inspect the installed packages.
          $statusDir = Join-Path $root 'installed\vcpkg'
          $updatesDir = Join-Path $statusDir 'updates'
          New-Item -ItemType Directory -Force -Path $updatesDir | Out-Null
          $statusFile = Join-Path $statusDir 'status'
          $hasUpdates = @(Get-ChildItem -Path $updatesDir -File -ErrorAction SilentlyContinue).Count -gt 0
          if (-not (Test-Path $statusFile) -and -not $hasUpdates) {
            throw "vcpkg status data not found under $statusDir"
          }

          Write-Host "Using VCPKG_ROOT=$root"
          Write-Host "Using VCPKGRS_TRIPLET=x64-windows-static-md"
          echo "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          echo "PKG_CONFIG=$env:RUNNER_TEMP\missing-pkg-config.exe" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=" >> $env:GITHUB_ENV

      - name: Check dear-imgui-sys FreeType via vcpkg fallback
        run: cargo check -p dear-imgui-sys --no-default-features --features freetype
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

      - name: Test native dependency helper search order
        run: cargo test -p dear-imgui-build-support --features pkg-config,vcpkg --lib

      - name: Check SDL3 header discovery via vcpkg fallback
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'dear-imgui-native-deps-smoke'
          New-Item -ItemType Directory -Force -Path (Join-Path $smoke 'src') | Out-Null
          $workspace = '${{ github.workspace }}'.Replace('\', '/')
          @"
          [package]
          name = "dear-imgui-native-deps-smoke"
          version = "0.0.0"
          edition = "2024"

          [build-dependencies]
          build-support = { package = "dear-imgui-build-support", path = "$workspace/tools/build-support", features = ["vcpkg"] }
          "@ | Set-Content -Path (Join-Path $smoke 'Cargo.toml')
          @'
          fn main() {
              let out_dir = std::path::PathBuf::from(std::env::var("OUT_DIR").unwrap());
              let found = build_support::find_sdl3_include_paths(build_support::Sdl3SearchConfig {
                  out_dir: &out_dir,
                  target_os: "windows",
                  use_pkg_config: false,
                  use_vcpkg: true,
              })
              .expect("SDL3 headers should be discoverable through vcpkg");
              assert!(
                  !found.include_paths.is_empty(),
                  "vcpkg SDL3 discovery returned no include paths"
              );
          }
          '@ | Set-Content -Path (Join-Path $smoke 'build.rs')
          'fn main() {}' | Set-Content -Path (Join-Path $smoke 'src\main.rs')
          $manifest = Join-Path $smoke 'Cargo.toml'
          cargo check --manifest-path $manifest

      - name: Check SDLRenderer3 backend with pkg-config unavailable
        run: cargo check -p dear-imgui-sdl3 --no-default-features --features sdlrenderer3-renderer
        env:
          IMGUI_SYS_FORCE_BUILD: "1"

  windows-gnu:
    name: Windows GNU link check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init required nested submodules (selective)
        run: python tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-toolchain

      - name: Add MinGW64 to PATH
        shell: powershell
        run: |
          $root = '${{ steps.msys2.outputs.msys2-location }}'
          $mingw = Join-Path $root 'mingw64\bin'
          echo $mingw >> $env:GITHUB_PATH
          echo "MINGW_BIN=$mingw" >> $env:GITHUB_ENV

      - name: Add windows-gnu target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cargo test (no-run) - dear-imgui-sys (windows-gnu)
        run: cargo test -p dear-imgui-sys --target x86_64-pc-windows-gnu --no-run
        env:
          # Validate MinGW/GNU link flags (e.g. shell32) via an actual link step.
          IMGUI_SYS_FORCE_BUILD: "1"
          # Pin tool paths based on MSYS2 install location (varies: D:\a\_temp\msys64 or C:\msys64).
          # Use the mingw64 environment tools (gcc/g++/ar) which target x86_64-w64-mingw32.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: '${{ env.MINGW_BIN }}\gcc.exe'
          CC_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\gcc.exe'
          CXX_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\g++.exe'
          AR_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\ar.exe'

      - name: Verify windows-gnu binary does not import libstdc++
        shell: powershell
        run: |
          $deps = Join-Path (Get-Location) 'target\x86_64-pc-windows-gnu\debug\deps'
          $binaries = Get-ChildItem $deps -Filter 'dear_imgui_sys-*.exe'
          if (-not $binaries) {
            throw "No dear_imgui_sys test binaries found in $deps"
          }

          foreach ($binary in $binaries) {
            Write-Host "Checking imports for $($binary.FullName)"
            $imports = & "$env:MINGW_BIN\objdump.exe" -p $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "objdump failed for $($binary.FullName)"
            }
            if ($imports | Select-String -Pattern 'DLL Name:\s+libstdc\+\+-6\.dll') {
              $imports | Select-String -Pattern 'DLL Name:'
              throw "$($binary.Name) imports libstdc++-6.dll"
            }
          }

