name: Release Gate

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Full 40-character release candidate SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character release candidate SHA
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  RUSTFLAGS: -Cdebuginfo=0

jobs:
  validate-candidate-identity:
    name: Validate candidate identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Validate candidate identity
        run: >-
          python3 tools/ci/release_evidence.py verify-candidate
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"

  test-engine-attempt-1:
    needs: validate-candidate-identity
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: test-engine-runtime
      gate_attempt: 1

  test-engine-attempt-2:
    needs: [validate-candidate-identity, test-engine-attempt-1]
    if: always() && needs.validate-candidate-identity.result == 'success' && needs.test-engine-attempt-1.outputs.retry_eligible == 'true'
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: test-engine-runtime
      gate_attempt: 2

  test-engine-cell:
    needs: [validate-candidate-identity, test-engine-attempt-1, test-engine-attempt-2]
    if: always() && needs.validate-candidate-identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download Test Engine attempt 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-test-engine-runtime-${{ inputs.candidate_sha }}-gate-1
          path: target/runtime-attempts/test-engine/attempt1

      - name: Download Test Engine attempt 2
        if: always() && needs.test-engine-attempt-2.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-test-engine-runtime-${{ inputs.candidate_sha }}-gate-2
          path: target/runtime-attempts/test-engine/attempt2

      - name: Finalize Test Engine cell without retry
        if: always() && needs.test-engine-attempt-2.result == 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-test-engine-runtime
          --cell-root target/release-evidence/linux-test-engine-runtime
          --attempt1 target/runtime-attempts/test-engine/attempt1

      - name: Finalize Test Engine cell with retry
        if: always() && needs.test-engine-attempt-2.result != 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-test-engine-runtime
          --cell-root target/release-evidence/linux-test-engine-runtime
          --attempt1 target/runtime-attempts/test-engine/attempt1
          --attempt2 target/runtime-attempts/test-engine/attempt2

      - name: Retain Test Engine release cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cell-linux-test-engine-runtime-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  viewport-attempt-1:
    needs: validate-candidate-identity
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: multi-viewport-smoke
      gate_attempt: 1

  viewport-attempt-2:
    needs: [validate-candidate-identity, viewport-attempt-1]
    if: always() && needs.validate-candidate-identity.result == 'success' && needs.viewport-attempt-1.outputs.retry_eligible == 'true'
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: multi-viewport-smoke
      gate_attempt: 2

  viewport-cell:
    needs: [validate-candidate-identity, viewport-attempt-1, viewport-attempt-2]
    if: always() && needs.validate-candidate-identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download viewport attempt 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-multi-viewport-smoke-${{ inputs.candidate_sha }}-gate-1
          path: target/runtime-attempts/viewport/attempt1

      - name: Download viewport attempt 2
        if: always() && needs.viewport-attempt-2.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-multi-viewport-smoke-${{ inputs.candidate_sha }}-gate-2
          path: target/runtime-attempts/viewport/attempt2

      - name: Finalize viewport cell without retry
        if: always() && needs.viewport-attempt-2.result == 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-multi-viewport-smoke
          --cell-root target/release-evidence/linux-multi-viewport-smoke
          --attempt1 target/runtime-attempts/viewport/attempt1

      - name: Finalize viewport cell with retry
        if: always() && needs.viewport-attempt-2.result != 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-multi-viewport-smoke
          --cell-root target/release-evidence/linux-multi-viewport-smoke
          --attempt1 target/runtime-attempts/viewport/attempt1
          --attempt2 target/runtime-attempts/viewport/attempt2

      - name: Retain viewport release cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cell-linux-multi-viewport-smoke-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  ash-vulkan-validation-attempt-1:
    needs: validate-candidate-identity
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: ash-vulkan-validation-smoke
      gate_attempt: 1

  ash-vulkan-validation-attempt-2:
    needs: [validate-candidate-identity, ash-vulkan-validation-attempt-1]
    if: always() && needs.validate-candidate-identity.result == 'success' && needs.ash-vulkan-validation-attempt-1.outputs.retry_eligible == 'true'
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: ash-vulkan-validation-smoke
      gate_attempt: 2

  ash-vulkan-validation-cell:
    needs: [validate-candidate-identity, ash-vulkan-validation-attempt-1, ash-vulkan-validation-attempt-2]
    if: always() && needs.validate-candidate-identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download Ash Vulkan validation attempt 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-ash-vulkan-validation-smoke-${{ inputs.candidate_sha }}-gate-1
          path: target/runtime-attempts/ash-vulkan-validation/attempt1

      - name: Download Ash Vulkan validation attempt 2
        if: always() && needs.ash-vulkan-validation-attempt-2.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-ash-vulkan-validation-smoke-${{ inputs.candidate_sha }}-gate-2
          path: target/runtime-attempts/ash-vulkan-validation/attempt2

      - name: Finalize Ash Vulkan validation cell without retry
        if: always() && needs.ash-vulkan-validation-attempt-2.result == 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-ash-vulkan-validation-smoke
          --cell-root target/release-evidence/linux-ash-vulkan-validation-smoke
          --attempt1 target/runtime-attempts/ash-vulkan-validation/attempt1

      - name: Finalize Ash Vulkan validation cell with retry
        if: always() && needs.ash-vulkan-validation-attempt-2.result != 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-ash-vulkan-validation-smoke
          --cell-root target/release-evidence/linux-ash-vulkan-validation-smoke
          --attempt1 target/runtime-attempts/ash-vulkan-validation/attempt1
          --attempt2 target/runtime-attempts/ash-vulkan-validation/attempt2

      - name: Retain Ash Vulkan validation release cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cell-linux-ash-vulkan-validation-smoke-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  sdl3-glow-viewport-attempt-1:
    needs: validate-candidate-identity
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: sdl3-glow-multi-viewport-smoke
      gate_attempt: 1

  sdl3-glow-viewport-attempt-2:
    needs: [validate-candidate-identity, sdl3-glow-viewport-attempt-1]
    if: always() && needs.validate-candidate-identity.result == 'success' && needs.sdl3-glow-viewport-attempt-1.outputs.retry_eligible == 'true'
    uses: ./.github/workflows/native-runtime.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      contract: sdl3-glow-multi-viewport-smoke
      gate_attempt: 2

  sdl3-glow-viewport-cell:
    needs: [validate-candidate-identity, sdl3-glow-viewport-attempt-1, sdl3-glow-viewport-attempt-2]
    if: always() && needs.validate-candidate-identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download SDL3/Glow viewport attempt 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-sdl3-glow-multi-viewport-smoke-${{ inputs.candidate_sha }}-gate-1
          path: target/runtime-attempts/sdl3-glow-viewport/attempt1

      - name: Download SDL3/Glow viewport attempt 2
        if: always() && needs.sdl3-glow-viewport-attempt-2.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-runtime-sdl3-glow-multi-viewport-smoke-${{ inputs.candidate_sha }}-gate-2
          path: target/runtime-attempts/sdl3-glow-viewport/attempt2

      - name: Finalize SDL3/Glow viewport cell without retry
        if: always() && needs.sdl3-glow-viewport-attempt-2.result == 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-sdl3-glow-multi-viewport-smoke
          --cell-root target/release-evidence/linux-sdl3-glow-multi-viewport-smoke
          --attempt1 target/runtime-attempts/sdl3-glow-viewport/attempt1

      - name: Finalize SDL3/Glow viewport cell with retry
        if: always() && needs.sdl3-glow-viewport-attempt-2.result != 'skipped'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize-runtime
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-sdl3-glow-multi-viewport-smoke
          --cell-root target/release-evidence/linux-sdl3-glow-multi-viewport-smoke
          --attempt1 target/runtime-attempts/sdl3-glow-viewport/attempt1
          --attempt2 target/runtime-attempts/sdl3-glow-viewport/attempt2

      - name: Retain SDL3/Glow viewport release cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cell-linux-sdl3-glow-multi-viewport-smoke-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  standard-cells:
    needs: validate-candidate-identity
    name: ${{ matrix.cell_id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell_id: linux-wasm
            os: ubuntu-latest
            python: python3
            target: wasm32-unknown-unknown
            crt: ''
            rustflags: ''
          - cell_id: windows-vcpkg
            os: windows-latest
            python: python
            target: x86_64-pc-windows-msvc
            crt: md
            rustflags: -Cdebuginfo=0
          - cell_id: windows-platform-md
            os: windows-latest
            python: python
            target: x86_64-pc-windows-msvc
            crt: md
            rustflags: -Cdebuginfo=0
          - cell_id: windows-platform-mt
            os: windows-latest
            python: python
            target: x86_64-pc-windows-msvc
            crt: mt
            rustflags: -Cdebuginfo=0 -C target-feature=+crt-static
          - cell_id: windows-gnu
            os: windows-latest
            python: python
            target: x86_64-pc-windows-gnu
            crt: ''
            rustflags: -Cdebuginfo=0
          - cell_id: macos-build
            os: macos-15-intel
            python: python3
            target: x86_64-apple-darwin
            crt: ''
            rustflags: -Cdebuginfo=0
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          ref: ${{ inputs.candidate_sha }}

      - name: Initialize required nested submodules
        run: ${{ matrix.python }} tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-nextest
        if: startsWith(matrix.cell_id, 'windows-platform-')
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: 'false'
          key: release-${{ matrix.cell_id }}

      - name: Add WASM target
        if: matrix.cell_id == 'linux-wasm'
        run: rustup target add wasm32-unknown-unknown

      - name: Set up pinned Emscripten provider toolchain
        if: matrix.cell_id == 'linux-wasm'
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 5.0.1
          emsdk-version: 5.0.5

      - name: Install macOS dependencies
        if: matrix.cell_id == 'macos-build'
        run: brew install cmake freetype pkg-config sdl3

      - name: Set up vcpkg
        if: matrix.cell_id == 'windows-vcpkg'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Configure vcpkg route
        if: matrix.cell_id == 'windows-vcpkg'
        run: >-
          python tools/ci/run_contract.py windows-vcpkg
          --target x86_64-pc-windows-msvc
          --crt md
          --package freetype
          --package sdl3
          --runner-temp "$env:RUNNER_TEMP"
          --github-env "$env:GITHUB_ENV"

      - name: Set up MSYS2
        if: matrix.cell_id == 'windows-gnu'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Configure MinGW environment
        if: matrix.cell_id == 'windows-gnu'
        run: >-
          python tools/ci/run_contract.py windows-mingw-env
          --msys2-root "${{ steps.msys2.outputs.msys2-location }}"
          --github-env "$env:GITHUB_ENV"
          --github-path "$env:GITHUB_PATH"

      - name: Add Windows GNU target
        if: matrix.cell_id == 'windows-gnu'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Capture WASM route and provider contract
        if: matrix.cell_id == 'linux-wasm'
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-wasm
          --execution executions/run.json
          --stdout-log logs/stdout.log
          --stderr-log logs/stderr.log
          --timeout 2400
          --
          python3 -B tools/ci/verify_wasm_provider.py
          --check-rust-route

      - name: Capture vcpkg consumer
        if: matrix.cell_id == 'windows-vcpkg'
        continue-on-error: true
        run: >-
          python tools/ci/release_cell.py capture
          --cell-root target/release-evidence/windows-vcpkg
          --execution executions/run.json
          --stdout-log logs/stdout.log
          --stderr-log logs/stderr.log
          --timeout 2400
          --
          python tools/ci/run_contract.py windows-sdl3-consumer
          --workspace "$env:RUNNER_TEMP\dear-imgui-native-deps-smoke"
          --repo-root "$env:GITHUB_WORKSPACE"

      - name: Capture PlatformIO ABI contract
        if: startsWith(matrix.cell_id, 'windows-platform-')
        continue-on-error: true
        env:
          IMGUI_SYS_FORCE_BUILD: '1'
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: >-
          python tools/ci/release_cell.py capture
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/run.json
          --stdout-log logs/stdout.log
          --stderr-log logs/stderr.log
          --timeout 2400
          --
          cargo +stable nextest run
          -p dear-imgui-rs
          --features multi-viewport
          -E 'test(cpp_platform_io_probe_round_trips_all_aggregate_slots) | test(context_drop_clears_aggregate_callback_storage)'

      - name: Capture Windows GNU link
        if: matrix.cell_id == 'windows-gnu'
        continue-on-error: true
        env:
          IMGUI_SYS_FORCE_BUILD: '1'
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: '${{ env.MINGW_BIN }}\gcc.exe'
          CC_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\gcc.exe'
          CXX_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\g++.exe'
          AR_x86_64_pc_windows_gnu: '${{ env.MINGW_BIN }}\ar.exe'
        run: >-
          python tools/ci/release_cell.py capture
          --cell-root target/release-evidence/windows-gnu
          --execution executions/run.json
          --stdout-log logs/build.stdout.log
          --stderr-log logs/build.stderr.log
          --timeout 2400
          --
          cargo test
          -p dear-imgui-sys
          --target x86_64-pc-windows-gnu
          --no-run

      - name: Capture Windows GNU import inspection
        if: always() && matrix.cell_id == 'windows-gnu'
        continue-on-error: true
        run: >-
          python tools/ci/release_cell.py capture
          --cell-root target/release-evidence/windows-gnu
          --execution executions/imports.json
          --stdout-log logs/stdout.log
          --stderr-log logs/stderr.log
          --timeout 300
          --
          python tools/ci/run_contract.py windows-mingw-imports
          --deps "target\x86_64-pc-windows-gnu\debug\deps"
          --objdump "$env:MINGW_BIN\objdump.exe"
          --evidence "target\ci-evidence\windows-gnu\mingw-imports.txt"

      - name: Capture macOS workspace build
        if: matrix.cell_id == 'macos-build'
        continue-on-error: true
        env:
          IMGUI_SYS_FORCE_BUILD: '1'
          IMPLOT_SYS_FORCE_BUILD: '1'
          IMNODES_SYS_FORCE_BUILD: '1'
          NODE_EDITOR_SYS_FORCE_BUILD: '1'
          IMGUIZMO_SYS_FORCE_BUILD: '1'
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/macos-build
          --execution executions/run.json
          --stdout-log logs/stdout.log
          --stderr-log logs/stderr.log
          --timeout 3000
          --
          cargo build
          --workspace
          --exclude dear-imgui-examples
          --exclude dear-imgui-web-demo
          --exclude xtask

      - name: Materialize WASM metadata
        if: always() && matrix.cell_id == 'linux-wasm'
        run: >-
          python3 tools/ci/release_cell.py metadata
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-wasm
          --cell-root target/release-evidence/linux-wasm
          --target wasm32-unknown-unknown

      - name: Materialize vcpkg metadata
        if: always() && matrix.cell_id == 'windows-vcpkg'
        run: >-
          python tools/ci/release_cell.py metadata
          --repo-root "$env:GITHUB_WORKSPACE"
          --candidate-sha "$env:RELEASE_CANDIDATE_SHA"
          --cell-id windows-vcpkg
          --cell-root target/release-evidence/windows-vcpkg
          --target x86_64-pc-windows-msvc
          --crt md
          --vcpkg-root "$env:VCPKG_ROOT"

      - name: Materialize PlatformIO metadata
        if: always() && startsWith(matrix.cell_id, 'windows-platform-')
        run: >-
          python tools/ci/release_cell.py metadata
          --repo-root "$env:GITHUB_WORKSPACE"
          --candidate-sha "$env:RELEASE_CANDIDATE_SHA"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --target x86_64-pc-windows-msvc
          --crt "${{ matrix.crt }}"

      - name: Materialize Windows GNU metadata
        if: always() && matrix.cell_id == 'windows-gnu'
        run: >-
          python tools/ci/release_cell.py metadata
          --repo-root "$env:GITHUB_WORKSPACE"
          --candidate-sha "$env:RELEASE_CANDIDATE_SHA"
          --cell-id windows-gnu
          --cell-root target/release-evidence/windows-gnu
          --target x86_64-pc-windows-gnu
          --mingw-imports target/ci-evidence/windows-gnu/mingw-imports.txt

      - name: Materialize macOS metadata
        if: always() && matrix.cell_id == 'macos-build'
        run: >-
          python3 tools/ci/release_cell.py metadata
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id macos-build
          --cell-root target/release-evidence/macos-build
          --target x86_64-apple-darwin

      - name: Finalize standard release cell
        if: always() && runner.os != 'Windows'
        continue-on-error: true
        run: >-
          ${{ matrix.python }} tools/ci/release_cell.py finalize
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/run.json

      - name: Finalize Windows standard release cell
        if: always() && runner.os == 'Windows' && matrix.cell_id != 'windows-gnu'
        continue-on-error: true
        run: >-
          python tools/ci/release_cell.py finalize
          --repo-root "$env:GITHUB_WORKSPACE"
          --candidate-sha "$env:RELEASE_CANDIDATE_SHA"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/run.json

      - name: Finalize Windows GNU release cell
        if: always() && matrix.cell_id == 'windows-gnu'
        continue-on-error: true
        run: >-
          python tools/ci/release_cell.py finalize
          --repo-root "$env:GITHUB_WORKSPACE"
          --candidate-sha "$env:RELEASE_CANDIDATE_SHA"
          --cell-id windows-gnu
          --cell-root target/release-evidence/windows-gnu
          --execution executions/run.json
          --execution executions/imports.json

      - name: Retain standard release cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cell-${{ matrix.cell_id }}-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  source-packages:
    needs: validate-candidate-identity
    name: linux-source-packages
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          ref: ${{ inputs.candidate_sha }}

      - name: Initialize required nested submodules
        run: python3 tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest

      - name: Install fixed LLVM toolchain
        run: >-
          python3 tools/ci/install_llvm.py
          --destination "${{ runner.temp }}/llvm"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: 'false'
          key: release-linux-source-packages

      - name: Set up pinned Emscripten provider toolchain
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 5.0.1
          emsdk-version: 5.0.5

      - name: Refresh Linux package metadata
        run: sudo apt-get update

      - name: Install Linux dependencies
        run: >-
          sudo apt-get install -y
          build-essential pkg-config
          libasound2-dev
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxxf86vm-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libudev-dev
          mesa-common-dev libgl1-mesa-dev cmake

      - name: Capture binding specification tests
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/binding-models.json
          --stdout-log logs/binding-models.stdout.log
          --stderr-log logs/binding-models.stderr.log
          --timeout 1200
          --
          cargo +1.95.0 nextest run
          -p dear-imgui-build-support
          --features binding-spec

      - name: Capture vendored source provenance
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/source-provenance.json
          --stdout-log logs/source-provenance.stdout.log
          --stderr-log logs/source-provenance.stderr.log
          --timeout 300
          --
          python3 -B tools/source_metadata.py verify

      - name: Capture binding provenance
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/binding-provenance.json
          --stdout-log logs/binding-provenance.stdout.log
          --stderr-log logs/binding-provenance.stderr.log
          --timeout 300
          --
          python3 -B tools/source_metadata.py verify-bindings

      - name: Capture high-level API coverage
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/api-coverage.json
          --stdout-log logs/api-coverage.stdout.log
          --stderr-log logs/api-coverage.stderr.log
          --timeout 300
          --
          python3 -B tools/api_surface_report.py --check

      - name: Capture canonical binding regeneration
        continue-on-error: true
        env:
          LIBCLANG_PATH: ${{ runner.temp }}/llvm/lib
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/binding-regeneration.json
          --stdout-log logs/binding-regeneration.stdout.log
          --stderr-log logs/binding-regeneration.stderr.log
          --timeout 2400
          --
          cargo +1.95.0 run -p xtask -- verify-bindings --allow-dirty

      - name: Capture checked-in binding drift
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/binding-diff.json
          --stdout-log logs/binding-diff.stdout.log
          --stderr-log logs/binding-diff.stderr.log
          --timeout 300
          --
          git diff --exit-code --
          dear-imgui-sys/src/bindings_pregenerated.rs
          dear-imgui-sys/src/bindings_pregenerated_windows.rs
          dear-imgui-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-imgui-test-engine-sys/src/bindings_pregenerated.rs
          extensions/dear-implot-sys/src/bindings_pregenerated.rs
          extensions/dear-implot-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-implot3d-sys/src/bindings_pregenerated.rs
          extensions/dear-implot3d-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-imnodes-sys/src/bindings_pregenerated.rs
          extensions/dear-imnodes-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-node-editor-sys/src/bindings_pregenerated.rs
          extensions/dear-imguizmo-sys/src/bindings_pregenerated.rs
          extensions/dear-imguizmo-sys/src/wasm_bindings_pregenerated.rs
          extensions/dear-imguizmo-quat-sys/src/bindings_pregenerated.rs
          extensions/dear-imguizmo-quat-sys/src/wasm_bindings_pregenerated.rs

      - name: Capture declared MSRV contract
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/msrv.json
          --stdout-log logs/msrv.stdout.log
          --stderr-log logs/msrv.stderr.log
          --timeout 2400
          --
          cargo +1.92.0 check --workspace
          --exclude dear-imgui-bevy
          --exclude dear-imgui-examples
          --exclude dear-imgui-web-demo
          --exclude xtask

      - name: Capture core tests
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/core-tests.json
          --stdout-log logs/core-tests.stdout.log
          --stderr-log logs/core-tests.stderr.log
          --timeout 2400
          --
          cargo +1.95.0 nextest run
          -p dear-imgui-rs
          --features multi-viewport

      - name: Capture core public API doctests
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/core-docs.json
          --stdout-log logs/core-docs.stdout.log
          --stderr-log logs/core-docs.stderr.log
          --timeout 1200
          --
          cargo +1.95.0 test --doc
          -p dear-imgui-rs
          --features multi-viewport

      - name: Capture publishable source-package contract
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py capture
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/packages.json
          --stdout-log logs/packages.stdout.log
          --stderr-log logs/packages.stderr.log
          --timeout 4800
          --
          python3 -B tools/ci/verify_packaged_core.py source

      - name: Materialize source-package metadata
        if: always()
        run: >-
          python3 tools/ci/release_cell.py metadata
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-source-packages
          --cell-root target/release-evidence/linux-source-packages
          --target x86_64-unknown-linux-gnu

      - name: Finalize source-package release cell
        if: always()
        continue-on-error: true
        run: >-
          python3 tools/ci/release_cell.py finalize
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --cell-id linux-source-packages
          --cell-root target/release-evidence/linux-source-packages
          --execution executions/binding-models.json
          --execution executions/source-provenance.json
          --execution executions/binding-provenance.json
          --execution executions/api-coverage.json
          --execution executions/binding-regeneration.json
          --execution executions/binding-diff.json
          --execution executions/msrv.json
          --execution executions/core-tests.json
          --execution executions/core-docs.json
          --execution executions/packages.json

      - name: Retain source-package release cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cell-linux-source-packages-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  prebuilt:
    needs: validate-candidate-identity
    uses: ./.github/workflows/prebuilt-binaries.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}

  aggregate:
    needs: [validate-candidate-identity, test-engine-cell, viewport-cell, ash-vulkan-validation-cell, sdl3-glow-viewport-cell, standard-cells, source-packages, prebuilt]
    if: always() && needs.validate-candidate-identity.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download every release cell
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-cell-*-${{ inputs.candidate_sha }}
          path: target/release-evidence/cells
          merge-multiple: true

      - name: Ensure aggregate evidence root exists
        if: always()
        run: python3 -c "from pathlib import Path; Path('target/release-evidence/cells').mkdir(parents=True, exist_ok=True)"

      - name: Aggregate exact-SHA release evidence
        if: always()
        run: >-
          python3 tools/ci/release_cell.py aggregate
          --repo-root "$GITHUB_WORKSPACE"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --evidence-root target/release-evidence/cells
          --output gate-result.json

      - name: Retain authoritative release decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-${{ inputs.candidate_sha }}
          path: target/release-evidence/cells/gate-result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
