name: Build Prebuilt Binaries

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact release candidate commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character release candidate SHA
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-prebuilt:
    name: Build ${{ matrix.target }}${{ matrix.crt && format(' ({0})', matrix.crt) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell_id: prebuilt-x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            python: python3
            crt: ''
          - cell_id: prebuilt-x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-15-intel
            python: python3
            crt: ''
          - cell_id: prebuilt-aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-latest
            python: python3
            crt: ''
          - cell_id: prebuilt-x86_64-pc-windows-msvc-md
            target: x86_64-pc-windows-msvc
            os: windows-latest
            python: python
            crt: md
          - cell_id: prebuilt-x86_64-pc-windows-msvc-mt
            target: x86_64-pc-windows-msvc
            os: windows-latest
            python: python
            crt: mt

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ inputs.candidate_sha }}

      - name: Initialize required nested submodules
        run: ${{ matrix.python }} tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: 'false'
          key: ${{ format('{0}-{1}', matrix.target, matrix.crt || 'none') }}

      - name: Refresh Linux package metadata
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y build-essential pkg-config libfreetype6-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype pkg-config

      - name: Export FreeType pkg-config path (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/freetype/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Configure native dependencies (Windows)
        if: runner.os == 'Windows'
        run: >-
          python tools/ci/run_contract.py windows-vcpkg
          --target "${{ matrix.target }}"
          --crt "${{ matrix.crt }}"
          --package freetype
          --runner-temp "$env:RUNNER_TEMP"
          --github-env "$env:GITHUB_ENV"

      - name: Build complete core and extension profile matrix
        id: build
        continue-on-error: true
        run: >-
          ${{ matrix.python }} tools/ci/release_cell.py capture
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/build.json
          --stdout-log logs/build.stdout.log
          --stderr-log logs/build.stderr.log
          --timeout 4200
          --
          ${{ matrix.python }} tools/ci/verify_packaged_core.py build-prebuilt
          "${{ github.workspace }}/packages"
          "${{ matrix.target }}"
          "${{ inputs.candidate_sha }}"
          "${{ matrix.crt }}"
          --target-dir "${{ runner.temp }}/dear-imgui-prebuilt-target"

      - name: Consume every safe prebuilt profile
        id: consume
        if: always()
        continue-on-error: true
        run: >-
          ${{ matrix.python }} tools/ci/release_cell.py capture
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/consume.json
          --stdout-log logs/consume.stdout.log
          --stderr-log logs/consume.stderr.log
          --timeout 4200
          --
          ${{ matrix.python }} tools/ci/verify_packaged_core.py prebuilt
          "${{ github.workspace }}/packages"
          "${{ matrix.target }}"
          "${{ inputs.candidate_sha }}"
          "${{ matrix.crt }}"

      - name: Materialize prebuilt metadata (non-Windows)
        if: always() && matrix.crt == ''
        run: >-
          ${{ matrix.python }} tools/ci/release_cell.py metadata
          --repo-root "${{ github.workspace }}"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --target "${{ matrix.target }}"
          --package-dir "${{ github.workspace }}/packages"

      - name: Materialize prebuilt metadata (Windows)
        if: always() && matrix.crt != ''
        run: >-
          python tools/ci/release_cell.py metadata
          --repo-root "${{ github.workspace }}"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --target "${{ matrix.target }}"
          --crt "${{ matrix.crt }}"
          --package-dir "${{ github.workspace }}/packages"

      - name: Finalize prebuilt cell (non-Windows)
        if: always() && matrix.crt == ''
        run: >-
          ${{ matrix.python }} tools/ci/release_cell.py finalize
          --repo-root "${{ github.workspace }}"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/build.json
          --execution executions/consume.json
          --target "${{ matrix.target }}"

      - name: Finalize prebuilt cell (Windows)
        if: always() && matrix.crt != ''
        run: >-
          python tools/ci/release_cell.py finalize
          --repo-root "${{ github.workspace }}"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --cell-id "${{ matrix.cell_id }}"
          --cell-root "target/release-evidence/${{ matrix.cell_id }}"
          --execution executions/build.json
          --execution executions/consume.json
          --target "${{ matrix.target }}"
          --crt "${{ matrix.crt }}"

      - name: Retain prebuilt release cell
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-cell-${{ matrix.cell_id }}-${{ inputs.candidate_sha }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30
