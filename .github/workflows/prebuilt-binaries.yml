name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'dear-imgui-sys-v*'
      - 'dear-implot-sys-v*'
      - 'dear-implot3d-sys-v*'
      - 'dear-imnodes-sys-v*'
      - 'dear-node-editor-sys-v*'
      - 'dear-imguizmo-sys-v*'
      - 'dear-imguizmo-quat-sys-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.16.0)'
        required: false
        type: string
      branch:
        description: 'Branch to build when no tag is provided'
        required: false
        type: string
        default: main
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-prebuilt:
    name: Build ${{ matrix.target }}${{ matrix.crt && format(' ({0})', matrix.crt) || '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            crt: md
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            crt: mt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ inputs.tag || inputs.branch || github.ref }}

      - name: Initialize required nested submodules
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: 'false'
          key: ${{ format('{0}-{1}', matrix.target, matrix.crt || 'none') }}

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libfreetype6-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype pkg-config

      - name: Export FreeType pkg-config path (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/freetype/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Configure native dependencies (Windows)
        if: runner.os == 'Windows'
        run: python tools/ci/configure_prebuilt_windows.py --crt "${{ matrix.crt }}"

      - name: Build complete core and extension profile matrix
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          tools/ci/verify_packaged_core.py build-prebuilt
          "${{ github.workspace }}/packages"
          "${{ matrix.target }}"
          HEAD
          "${{ matrix.crt }}"
          --target-dir "${{ runner.temp }}/dear-imgui-prebuilt-target"

      - name: Consume every safe prebuilt profile
        run: >-
          ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          tools/ci/verify_packaged_core.py prebuilt
          "${{ github.workspace }}/packages"
          "${{ matrix.target }}"
          HEAD
          "${{ matrix.crt }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        if: inputs.tag || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ github.workspace }}/packages/*.tar.gz

      - name: Upload artifact (branch builds)
        if: inputs.branch && !inputs.tag && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-${{ matrix.target }}${{ matrix.crt && format('-{0}', matrix.crt) || '' }}-${{ inputs.branch }}-${{ github.sha }}
          path: ${{ github.workspace }}/packages/*.tar.gz
          if-no-files-found: error
