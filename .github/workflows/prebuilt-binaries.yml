name: Build Prebuilt Binaries

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact release candidate commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character release candidate SHA
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-prebuilt:
    name: Build ${{ matrix.target }}${{ matrix.crt && format(' ({0})', matrix.crt) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            python: python3
            crt: ''
          - artifact: x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-15-intel
            python: python3
            crt: ''
          - artifact: aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-latest
            python: python3
            crt: ''
          - artifact: x86_64-pc-windows-msvc-md
            target: x86_64-pc-windows-msvc
            os: windows-latest
            python: python
            crt: md
          - artifact: x86_64-pc-windows-msvc-mt
            target: x86_64-pc-windows-msvc
            os: windows-latest
            python: python
            crt: mt

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          ref: ${{ inputs.candidate_sha }}

      - name: Initialize required nested submodules
        run: ${{ matrix.python }} tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-bin: 'false'
          key: ${{ format('prebuilt-{0}', matrix.artifact) }}

      - name: Refresh Linux package metadata
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y build-essential pkg-config libfreetype6-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype pkg-config

      - name: Export FreeType pkg-config path (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/freetype/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 9a98f93671f984351377044210854900bfd73171
          runVcpkgInstall: false

      - name: Configure native dependencies (Windows)
        if: runner.os == 'Windows'
        run: >-
          python tools/ci/run_contract.py windows-vcpkg
          --target "${{ matrix.target }}"
          --crt "${{ matrix.crt }}"
          --package freetype
          --runner-temp "$env:RUNNER_TEMP"
          --github-env "$env:GITHUB_ENV"

      - name: Build every supported prebuilt profile
        run: >-
          ${{ matrix.python }} tools/ci/verify_packaged_core.py build-prebuilt
          "${{ github.workspace }}/packages"
          "${{ matrix.target }}"
          "${{ inputs.candidate_sha }}"
          "${{ matrix.crt }}"
          --target-dir "${{ runner.temp }}/dear-imgui-prebuilt-target"

      - name: Consume every generated prebuilt profile
        run: >-
          ${{ matrix.python }} tools/ci/verify_packaged_core.py prebuilt
          "${{ github.workspace }}/packages"
          "${{ matrix.target }}"
          "${{ inputs.candidate_sha }}"
          "${{ matrix.crt }}"

      - name: Retain prebuilt packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prebuilt-${{ matrix.artifact }}-${{ inputs.candidate_sha }}
          path: packages/*.tar.gz
          if-no-files-found: error
          retention-days: 30
