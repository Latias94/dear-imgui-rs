name: Build Prebuilt Binaries

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact release candidate commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character release candidate SHA
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  # Keep the installed prebuilt compiler selected despite rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: '1.97.1'

jobs:
  build-prebuilt:
    name: Build ${{ matrix.target }}${{ matrix.crt && format(' ({0})', matrix.crt) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            python: python3
            crt: ''
          - artifact: x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-15-intel
            python: python3
            crt: ''
          - artifact: aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-latest
            python: python3
            crt: ''
          - artifact: x86_64-pc-windows-msvc-md
            target: x86_64-pc-windows-msvc
            os: windows-latest
            python: python
            crt: md
          - artifact: x86_64-pc-windows-msvc-mt
            target: x86_64-pc-windows-msvc
            os: windows-latest
            python: python
            crt: mt

    steps:
      - name: Require a full candidate commit SHA
        shell: bash
        run: |
          if [[ ! $CANDIDATE_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::candidate_sha must be a full 40-character lowercase commit SHA'
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ inputs.candidate_sha }}

      - name: Initialize required nested submodules
        run: ${{ matrix.python }} tools/ci/update_submodules.py

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --no-self-update --target ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          key: ${{ format('prebuilt-{0}', matrix.artifact) }}

      - name: Refresh Linux package metadata
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y build-essential pkg-config libfreetype6-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype pkg-config

      - name: Export FreeType pkg-config path (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/freetype/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 9eec002df1cd109f8f104cd966a763daf9751489 # 2026.10.16
          runVcpkgInstall: false

      - name: Configure native dependencies (Windows)
        if: runner.os == 'Windows'
        run: >-
          python tools/ci/run_contract.py windows-vcpkg
          --target "${{ matrix.target }}"
          --crt "${{ matrix.crt }}"
          --package freetype
          --runner-temp "$env:RUNNER_TEMP"
          --github-env "$env:GITHUB_ENV"

      - name: Build every supported prebuilt profile
        shell: bash
        run: >-
          ${{ matrix.python }} tools/ci/verify_packaged_core.py build-prebuilt
          "$GITHUB_WORKSPACE/packages"
          "${{ matrix.target }}"
          "$CANDIDATE_SHA"
          "${{ matrix.crt }}"
          --target-dir "$RUNNER_TEMP/dear-imgui-prebuilt-target"

      - name: Consume every generated prebuilt profile
        shell: bash
        run: >-
          ${{ matrix.python }} tools/ci/verify_packaged_core.py prebuilt
          "$GITHUB_WORKSPACE/packages"
          "${{ matrix.target }}"
          "$CANDIDATE_SHA"
          "${{ matrix.crt }}"

      - name: Retain prebuilt packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.artifact }}-${{ inputs.candidate_sha }}
          path: packages/*.tar.gz
          if-no-files-found: error
          retention-days: 30
