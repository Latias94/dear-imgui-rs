name: Release Registry Recovery
run-name: Recover ${{ inputs.tag }} registry publication from ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the workspace version
        required: true
        type: string
      candidate_sha:
        description: Exact clean release candidate commit to publish
        required: true
        type: string

env:
  RELEASE_TAG_INPUT: ${{ inputs.tag }}
  RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}

concurrency:
  group: dear-imgui-release
  cancel-in-progress: false

permissions: {}

jobs:
  publish-crates:
    name: Recover crates.io release train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          submodules: true

      - name: Initialize required nested submodules
        run: python3 -B tools/ci/update_submodules.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'

      - name: Revalidate release identity
        run: >-
          python3 -B tools/ci/run_contract.py release-identity
          --tag "$RELEASE_TAG_INPUT"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --expected-ref "$GITHUB_REF"
          --actual-ref "$GITHUB_REF"

      - name: Recover complete crates.io release train
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: >-
          python3 -B tools/publish.py
          --yes
          --no-verify
          --publish-timeout 300
          --index-timeout 300
          --poll-interval 2
          --journal "$RUNNER_TEMP/publication-journal.json"

      - name: Retain publication journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-recovery-journal-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/publication-journal.json
          if-no-files-found: warn
          retention-days: 30
