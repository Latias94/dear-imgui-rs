[package]
name = "dear-imgui-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WGPU renderer backend for dear-imgui-rs (native + WebAssembly)"
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imgui-wgpu"
categories.workspace = true
keywords.workspace = true

[dependencies]
dear-imgui-backend-support.workspace = true
dear-imgui-rs.workspace = true
dear-imgui-sdl3 = { workspace = true, optional = true, features = ["multi-viewport"] }
dear-imgui-winit = { workspace = true, optional = true, features = ["multi-viewport"] }
wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
sdl3-sys = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

[features]
tracing = ["dep:tracing"]
# Enable multi-viewport support with the winit platform backend.
multi-viewport-winit = [
    "dear-imgui-rs/multi-viewport",
    "dep:winit",
    "dep:dear-imgui-winit",
]
# Enable multi-viewport support with SDL3 platform backend (native only)
multi-viewport-sdl3 = [
    "dear-imgui-rs/multi-viewport",
    "dep:sdl3-sys",
    "dep:raw-window-handle",
    "dep:objc2",
    "dep:dear-imgui-sdl3",
]
# Debug logging for multi-viewport paths (see mvlog! macro)
mv-log = []
# Enable WebGL support for WASM
webgl = ["wasm", "wgpu/webgl"]
webgpu = ["wasm", "wgpu/webgpu"]
wasm = ["dear-imgui-rs/wasm"]
# Experimental: enable wasm font-atlas access for testing
wasm-font-atlas-experimental = ["wasm", "dear-imgui-rs/wasm-font-atlas-experimental"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
sdl3-sys = { workspace = true, features = ["build-from-source"], optional = true }

[dev-dependencies]
pollster.workspace = true
static_assertions = "1.1"
