[package]
name = "dear-imgui-winit"
version.workspace = true
edition.workspace = true
description = "Winit platform backend for dear-imgui-rs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imgui-winit"
categories.workspace = true
keywords.workspace = true

[dependencies]
dear-imgui-rs.workspace = true
thiserror.workspace = true
winit.workspace = true

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Enable multi-viewport support (WIP). Declared to silence cfg warnings; kept off by default.
multi-viewport = ["dear-imgui-rs/multi-viewport"]
# Debug logging for multi-viewport paths (see mvlog! macro in src/multi_viewport.rs).
mv-log = []
