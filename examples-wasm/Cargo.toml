[package]
name = "dear-imgui-web-demo"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Enable both backends so wgpu decides at runtime (webgl2 or webgpu)
default = ["web-backends"]
web-backends = ["wgpu/webgl", "wgpu/webgpu", "dear-imgui-wgpu/webgl", "dear-imgui-wgpu/webgpu"]
experimental-fonts = [
    "dear-imgui-rs/wasm-font-atlas-experimental",
    "dear-imgui-wgpu/wasm-font-atlas-experimental",
]
implot = ["dep:dear-implot"]
implot3d = ["dep:dear-implot3d"]
imnodes = ["dep:dear-imnodes"]
imguizmo = ["dep:dear-imguizmo"]
imguizmo-quat = ["dep:dear-imguizmo-quat"]
cte = ["dep:dear-imgui-cte", "experimental-fonts"]

[dependencies]
dear-imgui-rs = { workspace = true, features = ["wasm"] }
dear-imgui-winit.workspace = true
dear-imgui-wgpu.workspace = true
dear-implot = { workspace = true, optional = true, features = ["wasm"] }
dear-implot3d = { workspace = true, optional = true, features = ["wasm"] }
dear-imnodes = { workspace = true, optional = true, features = ["wasm"] }
dear-imguizmo = { workspace = true, optional = true, features = ["wasm"] }
dear-imguizmo-quat = { workspace = true, optional = true, features = ["wasm"] }
dear-imgui-cte = { workspace = true, optional = true, features = ["wasm"] }
wgpu = { workspace = true }
winit = { workspace = true }
web-time = { workspace = true }

# wasm/web runtime helpers
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
