[package]
name = "dear-imgui-rs"
version.workspace = true
edition.workspace = true
description = "High-level Rust bindings to Dear ImGui v1.92.9b with docking, WGPU/GL backends, and extensions (ImPlot/ImPlot3D, ImNodes, ImGuizmo, file browser, reflection-based UI)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imgui-rs"
categories.workspace = true
keywords.workspace = true
readme = "../README.md"

[package.metadata.docs.rs]
features = ["freetype"]

[dependencies]
bitflags.workspace = true
dear-imgui-sys.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
# Docking is always enabled; feature removed.
# Enable multi-viewport support (define feature to satisfy cfg checks; opt-in)
multi-viewport = []
# Enable freetype font rasterizer
freetype = ["dear-imgui-sys/freetype"]
# Enable Dear ImGui test engine hooks in dear-imgui-sys.
test-engine = ["dear-imgui-sys/test-engine"]
# Allow dear-imgui-sys to download a compatible native prebuilt artifact.
prebuilt = ["dear-imgui-sys/prebuilt"]
# Force dear-imgui-sys to compile the native Dear ImGui artifact from source.
build-from-source = ["dear-imgui-sys/build-from-source"]
# Internal CI-only C++/Rust public aggregate layout probe.
abi-probe = ["dear-imgui-sys/abi-probe"]
serde = ["dep:serde"]
# Enable for WASM targets (import-style provider)
wasm = ["dear-imgui-sys/wasm"]
# Enable the native patched Dear ImGui artifact used by blueprint-style stack layouts.
stack-layout = ["dear-imgui-sys/stack-layout"]
# Experimental: enable direct font atlas access on wasm. Requires the shared
# memory provider (imgui-sys-v0) built via xtask; API and behaviour may change.
wasm-font-atlas-experimental = []
# Optional math interop: enable glam support in the sys crate so draw/list APIs
# taking Into<sys::ImVec2>/ImVec4 can accept glam vectors directly.
glam = ["dear-imgui-sys/glam"]

[dev-dependencies]
approx = "0.5"
pretty_assertions = "1.4"
serde_json = "1"
serde_test = "1"
static_assertions = "1.1"
once_cell = "1.21"
glam.workspace = true
mint.workspace = true
