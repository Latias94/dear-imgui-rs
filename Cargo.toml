[workspace]
resolver = "2"
members = [
    "dear-imgui-sys",
    "dear-imgui",
    "backends/dear-imgui-winit",
    "backends/dear-imgui-wgpu",
    "backends/dear-imgui-glow",
    "backends/dear-imgui-sdl3",
    "backends/dear-imgui-ash",
    "backends/dear-imgui-bevy",
    "dear-app",
    "extensions/dear-file-browser",
    "extensions/dear-implot-sys",
    "extensions/dear-implot",
    "extensions/dear-implot3d-sys",
    "extensions/dear-implot3d",
    "extensions/dear-imguizmo-sys",
    "extensions/dear-imguizmo",
    "extensions/dear-imguizmo-quat-sys",
    "extensions/dear-imguizmo-quat",
    "extensions/dear-imgui-test-engine-sys",
    "extensions/dear-imgui-test-engine",
    "extensions/dear-imnodes-sys",
    "extensions/dear-imnodes",
    "extensions/dear-node-editor-sys",
    "extensions/dear-node-editor",
    "extensions/dear-imgui-reflect",
    "extensions/dear-imgui-reflect-derive",
    "examples",
    "examples-wasm",
    "xtask",
    "tools/build-support",
]

exclude = [
    # Reference clones used by workstream planning and version-gated backend crates.
    "repo-ref/bevy",
]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.92"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/dear-imgui-rs"
homepage = "https://github.com/Latias94/dear-imgui-rs"
documentation = "https://docs.rs/dear-imgui-rs"
categories = ["gui", "api-bindings"]
keywords = ["imgui", "ui", "graphics", "docking", "multiview"]

[workspace.metadata.dear-imgui-release]
core-package = "dear-imgui-rs"

[workspace.metadata.dear-imgui-release.private-packages]
dear-imgui-examples = { path = "examples", version = "0.1.0" }
dear-imgui-web-demo = { path = "examples-wasm", version = "0.1.0" }
xtask = { path = "xtask", version = "0.1.0" }

[workspace.dependencies]
# Workspace release catalog. Keep every publishable package here so member
# manifests inherit one path and one registry requirement for internal edges.
build-support = { package = "dear-imgui-build-support", version = "0.16", path = "tools/build-support" }
dear-app = { version = "0.16", path = "dear-app" }
dear-file-browser = { version = "0.16", path = "extensions/dear-file-browser" }
dear-imgui-ash = { version = "0.16", path = "backends/dear-imgui-ash" }
dear-imgui-bevy = { version = "0.16", path = "backends/dear-imgui-bevy" }
dear-imgui-glow = { version = "0.16", path = "backends/dear-imgui-glow" }
dear-imgui-reflect = { version = "0.16", path = "extensions/dear-imgui-reflect" }
dear-imgui-reflect-derive = { version = "0.16", path = "extensions/dear-imgui-reflect-derive" }
dear-imgui-rs = { version = "0.16", path = "dear-imgui" }
dear-imgui-sdl3 = { version = "0.16", path = "backends/dear-imgui-sdl3" }
dear-imgui-sys = { version = "0.16", path = "dear-imgui-sys" }
dear-imgui-test-engine = { version = "0.16", path = "extensions/dear-imgui-test-engine" }
dear-imgui-test-engine-sys = { version = "0.16", path = "extensions/dear-imgui-test-engine-sys", default-features = false }
dear-imgui-wgpu = { version = "0.16", path = "backends/dear-imgui-wgpu" }
dear-imgui-winit = { version = "0.16", path = "backends/dear-imgui-winit" }
dear-imguizmo = { version = "0.16", path = "extensions/dear-imguizmo" }
dear-imguizmo-quat = { version = "0.16", path = "extensions/dear-imguizmo-quat" }
dear-imguizmo-quat-sys = { version = "0.16", path = "extensions/dear-imguizmo-quat-sys" }
dear-imguizmo-sys = { version = "0.16", path = "extensions/dear-imguizmo-sys" }
dear-imnodes = { version = "0.16", path = "extensions/dear-imnodes" }
dear-imnodes-sys = { version = "0.16", path = "extensions/dear-imnodes-sys" }
dear-implot = { version = "0.16", path = "extensions/dear-implot" }
dear-implot-sys = { version = "0.16", path = "extensions/dear-implot-sys" }
dear-implot3d = { version = "0.16", path = "extensions/dear-implot3d" }
dear-implot3d-sys = { version = "0.16", path = "extensions/dear-implot3d-sys" }
dear-node-editor = { version = "0.16", path = "extensions/dear-node-editor" }
dear-node-editor-sys = { version = "0.16", path = "extensions/dear-node-editor-sys" }

# Core dependencies
bitflags = "2.11"
parking_lot = "0.12"
cfg-if = "1.0"
serde = { version = "1", features = ["derive"] }
glam = "0.32"

# Graphics and windowing
wgpu = "30.0"
winit = "0.30.13"
glow = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
image = "0.25"

# Build dependencies
bindgen = "0.72"
cc = "1.2"
pkg-config = "0.3"
vcpkg = "0.2.15"
xshell = "0.2"

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utility
mint = "0.5.9"
env_logger = "0.11"
pollster = "0.4"
web-time = "1.1"

# WASM dependencies
console_error_panic_hook = "0.1"
console_log = "1"
fern = "0.7"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"

flate2 = "1"
tar = "0.4"
bytemuck = "1.25"
memoffset = "0.9"
semver = "1"
tempfile = "3"
toml_edit = "0.25"
