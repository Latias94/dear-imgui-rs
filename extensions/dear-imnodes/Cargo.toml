[package]
name = "dear-imnodes"
version.workspace = true
edition.workspace = true
description = "Safe, idiomatic Rust bindings for ImNodes (node editor for Dear ImGui)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
dear-imgui-rs.workspace = true
dear-imnodes-sys.workspace = true
bitflags.workspace = true
thiserror.workspace = true

[features]
default = []
prebuilt = ["dear-imgui-rs/prebuilt", "dear-imnodes-sys/prebuilt"]
build-from-source = ["dear-imgui-rs/build-from-source", "dear-imnodes-sys/build-from-source"]
# Docking is always enabled; remove feature.
# Enable multi-viewport support (commented out while WIP)
# multi-viewport = ["dear-imgui-rs/multi-viewport", "dear-imnodes-sys/multi-viewport"]
freetype = ["dear-imgui-rs/freetype", "dear-imnodes-sys/freetype"]
wasm = ["dear-imgui-rs/wasm", "dear-imnodes-sys/wasm"]

[dev-dependencies]
static_assertions = "1.1"
