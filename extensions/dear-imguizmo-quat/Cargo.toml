[package]
name = "dear-imguizmo-quat"
version.workspace = true
edition.workspace = true
description = "High-level Rust bindings for ImGuIZMO.quat (C API) with Dear ImGui integration"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imguizmo-quat"
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
dear-imgui-rs.workspace = true
dear-imgui-sys.workspace = true
dear-imguizmo-quat-sys.workspace = true
thiserror.workspace = true
bitflags = { workspace = true }
glam = { workspace = true, optional = true }
mint = { workspace = true, optional = true }

[features]
default = ["glam"]
freetype = ["dear-imgui-rs/freetype", "dear-imguizmo-quat-sys/freetype"]
glam = ["dep:glam"]
mint = ["dep:mint"]
wasm = ["dear-imgui-rs/wasm", "dear-imguizmo-quat-sys/wasm"]
