[package]
name = "dear-implot3d"
version.workspace = true
edition.workspace = true
description = "High-level Rust bindings to ImPlot3D with dear-imgui-rs integration"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-implot3d"
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
features = []

[dependencies]
bitflags.workspace = true
dear-imgui-rs.workspace = true
dear-implot3d-sys.workspace = true
dear-imgui-sys.workspace = true
mint = { workspace = true, optional = true }

[features]
default = []
prebuilt = ["dear-imgui-rs/prebuilt", "dear-implot3d-sys/prebuilt"]
build-from-source = ["dear-imgui-rs/build-from-source", "dear-implot3d-sys/build-from-source"]
mint = ["dep:mint"]
wasm = ["dear-imgui-rs/wasm", "dear-implot3d-sys/wasm"]

[dev-dependencies]
dear-implot3d-sys = { workspace = true, features = ["surface-test-probe"] }
static_assertions = "1.1"
