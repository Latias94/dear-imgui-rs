[package]
name = "dear-node-editor"
version.workspace = true
edition.workspace = true
description = "Safe Rust bindings for imgui-node-editor for Dear ImGui"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
dear-imgui-rs.workspace = true
dear-node-editor-sys.workspace = true
bitflags.workspace = true
thiserror.workspace = true

[features]
default = []
prebuilt = ["dear-imgui-rs/prebuilt", "dear-node-editor-sys/prebuilt"]
build-from-source = ["dear-imgui-rs/build-from-source", "dear-node-editor-sys/build-from-source"]
freetype = ["dear-imgui-rs/freetype", "dear-node-editor-sys/freetype"]
blueprints = ["dear-imgui-rs/stack-layout", "dear-node-editor-sys/stack-layout"]

[dev-dependencies]
static_assertions = "1.1"
