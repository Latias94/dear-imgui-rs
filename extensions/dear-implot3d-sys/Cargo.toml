[package]
name = "dear-implot3d-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Low-level FFI bindings for ImPlot3D via cimplot3d (C API)"
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
build = "build.rs"
links = "dear_implot3d"

# Exclude heavy upstream folders from package tarball
exclude = [
    # upstream cimplot3d generator (not needed in crate)
    "third-party/cimplot3d/generator/**",
    # upstream implot3d heavy content not needed to build the wrapper
    "third-party/cimplot3d/implot3d/example/**",
    "third-party/cimplot3d/implot3d/.github/**",
]

[package.metadata.dear-imgui-binding]
source-revision = "c7b527f318c1e18cfe4c05b3cd666ce44175779e"

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dear-imgui-sys.workspace = true

[build-dependencies]
build-support = { workspace = true, features = ["binding-spec"] }

[features]
default = []
bindgen = ["build-support/bindgen", "dear-imgui-sys/bindgen"]
prebuilt = ["build-support/download"]
build-from-source = []
wasm = ["dear-imgui-sys/wasm"]
surface-test-probe = []
