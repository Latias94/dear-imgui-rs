[package]
name = "dear-imguizmo-quat-sys"
version.workspace = true
edition.workspace = true
description = "Low-level FFI bindings for ImGuIZMO.quat via cimguizmo_quat (C API)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
build = "build.rs"
links = "dear_imguizmo_quat"

# Exclude heavy upstream folders from package tarball
exclude = [
    # upstream generated helpers and outputs
    "third-party/cimguizmo_quat/generator/**",
    # imGuIZMO.quat upstream heavy folders not needed for building the C API wrapper
    "third-party/cimguizmo_quat/imGuIZMO.quat/examples/**",
    "third-party/cimguizmo_quat/imGuIZMO.quat/basic_examples/**",
    "third-party/cimguizmo_quat/imGuIZMO.quat/old_examples/**",
    "third-party/cimguizmo_quat/imGuIZMO.quat/commons/**",
    "third-party/cimguizmo_quat/imGuIZMO.quat/libs/**",
    "third-party/cimguizmo_quat/imGuIZMO.quat/.github/**",
    # generic binary/assets folders
    "third-party/cimguizmo_quat/**/bin/**",
    "third-party/cimguizmo_quat/**/Images/**",
    # IDE folders
    "third-party/cimguizmo_quat/**/.vs/**",
    "third-party/cimguizmo_quat/**/.vscode/**",
]

[package.metadata.dear-imgui-binding]
source-revision = "705e700c0f011f91df3b72a521a040906cbdfe25"

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dear-imgui-sys.workspace = true
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
cc.workspace = true
build-support = { workspace = true, features = ["binding-spec"] }

[[bin]]
name = "package"
path = "bin/package/main.rs"
required-features = ["package-bin"]

[features]
package-bin = ["dep:flate2", "dep:tar"]
default = []
bindgen = ["dep:bindgen", "dear-imgui-sys/bindgen"]
freetype = ["dear-imgui-sys/freetype"]
wasm = ["dear-imgui-sys/wasm"]
prebuilt = ["build-support/download"]
build-from-source = []
