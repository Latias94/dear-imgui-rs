[package]
name = "dear-file-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "File dialogs and in-UI file browser for dear-imgui-rs"
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
features = ["imgui", "native-rfd"]

[features]
# Native dialogs are opt-in, including on desktop.
default = ["imgui", "tracing"]
# ImGui UI backend, including local file dates and scan timing.
imgui = ["dep:indexmap", "dep:jiff", "dep:lru", "dep:rustix", "dep:web-time", "dep:windows-sys"]
native-rfd = ["dep:rfd"]
tracing = ["dep:tracing"]
thumbnails-image = ["imgui", "dep:image"]

[dependencies]
dear-imgui-rs.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

jiff = { version = "1.0.2", features = ["js"], optional = true }
web-time = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
regex = "1.13"
indexmap = { version = "2", optional = true }
lru = { version = "0.18.5", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
dear-imgui-rs = { workspace = true, features = ["wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.18", optional = true, default-features = false, features = ["xdg-portal"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
pollster = { workspace = true }
