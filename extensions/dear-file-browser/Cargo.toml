[package]
name = "dear-file-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "File dialogs and in-UI file browser for dear-imgui-rs"
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
features = ["imgui", "native-rfd"]

[features]
# Defaults: enable both backends and tracing. Runtime picks the best.
default = ["imgui", "native-rfd", "tracing"]
# ImGui UI backend, including local file dates and scan timing.
imgui = ["dep:jiff", "dep:regex", "dep:web-time"]
native-rfd = ["dep:rfd"]
tracing = ["dep:tracing"]
thumbnails-image = ["imgui", "dep:image"]

[dependencies]
dear-imgui-rs.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

# Native file dialogs (desktop + wasm) — optional
rfd = { version = "0.18", optional = true, default-features = false, features = ["xdg-portal"] }
jiff = { version = "1.0.2", features = ["js"], optional = true }
web-time = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
regex = { version = "1.13", optional = true }
indexmap = "2"

[dev-dependencies]
pollster = { workspace = true }
