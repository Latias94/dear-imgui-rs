[package]
name = "dear-imguizmo"
version.workspace = true
edition.workspace = true
description = "High-level Rust bindings for ImGuizmo (C API) with Dear ImGui integration"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imguizmo"
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
dear-imgui-rs.workspace = true
dear-imgui-sys.workspace = true
dear-imguizmo-sys.workspace = true
thiserror.workspace = true
bitflags = { workspace = true }
glam = { workspace = true, optional = true }
mint = { workspace = true, optional = true }

[features]
default = ["glam"]
# Docking is always enabled; remove feature.
# Enable multi-viewport support (commented out while WIP)
# multi-viewport = ["dear-imgui-rs/multi-viewport", "dear-imguizmo-sys/multi-viewport"]
freetype = ["dear-imgui-rs/freetype", "dear-imguizmo-sys/freetype"]
glam = ["dep:glam"]
mint = ["dep:mint"]
wasm = ["dear-imgui-rs/wasm", "dear-imguizmo-sys/wasm"]

[dev-dependencies]
dear-imnodes.workspace = true
dear-implot.workspace = true
dear-node-editor.workspace = true
