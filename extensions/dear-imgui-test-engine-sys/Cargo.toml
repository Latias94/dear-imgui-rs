[package]
name = "dear-imgui-test-engine-sys"
version.workspace = true
edition.workspace = true
description = "Low-level FFI bindings for Dear ImGui Test Engine"
license-file = "LICENSE.txt"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dear-imgui-test-engine-sys"
categories.workspace = true
keywords.workspace = true
readme = "README.md"
build = "build.rs"
links = "dear_imgui_test_engine"

exclude = [
    "third-party/imgui_test_engine/.github/**",
    "third-party/imgui_test_engine/build_scripts/**",
    "third-party/imgui_test_engine/docs/**",
    # Keep only the two upstream suites compiled by the opt-in Test Engine gates.
    "third-party/imgui_test_engine/imgui_test_suite/assets/**",
    "third-party/imgui_test_engine/imgui_test_suite/thirdparty/**",
    "third-party/imgui_test_engine/imgui_test_suite/tools/**",
    "third-party/imgui_test_engine/imgui_test_suite/build_win64.bat",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_test_suite_imconfig.h",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_test_suite.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_test_suite.h",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_test_suite.vcxproj",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_test_suite.vcxproj.filters",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_core.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_inputs.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_nav.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_perf.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_tables.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_widgets.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/imgui_tests_widgets_inputtext.cpp",
    "third-party/imgui_test_engine/imgui_test_suite/Makefile",
    "third-party/imgui_test_engine/shared/**",
]

[package.metadata.dear-imgui-binding]
source-revision = "508a8fc8dacac2f346d353fed31b9bc90ed29adc"

[package.metadata.docs.rs]
no-default-features = true
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dear-imgui-sys = { workspace = true, features = ["test-engine"] }

[build-dependencies]
bindgen = { workspace = true, optional = true }
build-support = { workspace = true, features = ["binding-spec"] }
cc.workspace = true

[features]
default = []
bindgen = ["dep:bindgen", "dear-imgui-sys/bindgen"]
freetype = ["dear-imgui-sys/freetype"]
capture = []
